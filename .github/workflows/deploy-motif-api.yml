name: Deploy Motif3 API Proxy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-motif-api.yml'
      - 'supabase/config.toml'
      - 'supabase/functions/motif-api/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure Motif3 API secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MOTIF_API_KEY: ${{ secrets.MOTIF_300B }}
        run: |
          test -n "$MOTIF_API_KEY" || { echo "::error::MOTIF_300B secret is empty"; exit 1; }
          supabase secrets set MOTIF_API_KEY="$MOTIF_API_KEY" --project-ref enpovkaknaxfgzanyghn

      - name: Deploy Motif3 API function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy motif-api --project-ref enpovkaknaxfgzanyghn
