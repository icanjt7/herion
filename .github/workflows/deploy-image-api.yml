name: Deploy Image Recognition and Generation API Proxy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-image-api.yml'
      - 'supabase/config.toml'
      - 'supabase/functions/image-api/**'
      - 'supabase/functions/_shared/sensitive-data.ts'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_KHA_PROJECT }}
          NEMOTRON_VL: ${{ secrets.NEMOTRON_VL }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$NEMOTRON_VL"

      - name: Configure NVIDIA vision secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_KHA_PROJECT }}
          NEMOTRON_VL: ${{ secrets.NEMOTRON_VL }}
        run: supabase secrets set NEMOTRON_VL="$NEMOTRON_VL" --project-ref enpovkaknaxfgzanyghn

      - name: Configure optional Cloudflare image generation secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_KHA_PROJECT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]] && [[ -n "$CLOUDFLARE_API_TOKEN" ]]; then
            supabase secrets set \
              CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" \
              CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" \
              --project-ref enpovkaknaxfgzanyghn
          else
            echo "Cloudflare image generator is not configured; NVIDIA image recognition will still be deployed."
          fi

      - name: Deploy image API function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_KHA_PROJECT }}
        run: supabase functions deploy image-api --project-ref enpovkaknaxfgzanyghn
