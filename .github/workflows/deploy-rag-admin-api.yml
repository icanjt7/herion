name: Deploy RAG Admin API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-rag-admin-api.yml'
      - 'supabase/config.toml'
      - 'supabase/functions/rag-admin-api/**'
      - 'supabase/functions/motif-api/rag.ts'
      - 'supabase/functions/motif-api/rag-corpus*.ts'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate deployment configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_KHA_PROJECT }}
          RAG_DATA_KEY: ${{ secrets.RAG_DATA_KEY }}
          RAG_WORK_HANDBOOK_KEY: ${{ secrets.RAG_WORK_HANDBOOK_KEY }}
        run: test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$RAG_DATA_KEY" && test -n "$RAG_WORK_HANDBOOK_KEY"
      - name: Deploy RAG admin function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_KHA_PROJECT }}
        run: supabase functions deploy rag-admin-api --project-ref enpovkaknaxfgzanyghn
