name: Deploy Web Search API Proxy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-web-search-api.yml'
      - 'supabase/config.toml'
      - 'supabase/functions/web-search-api/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_KHA_PROJECT }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$TAVILY_API_KEY"

      - name: Configure Tavily API secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_KHA_PROJECT }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API }}
        run: supabase secrets set TAVILY_API_KEY="$TAVILY_API_KEY" --project-ref enpovkaknaxfgzanyghn

      - name: Deploy web search API function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_KHA_PROJECT }}
        run: supabase functions deploy web-search-api --project-ref enpovkaknaxfgzanyghn
