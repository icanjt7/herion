name: Deploy Source Document API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-source-document-api.yml'
      - 'supabase/config.toml'
      - 'supabase/functions/source-document-api/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate deployment configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_KHA_PROJECT }}
          SOURCE_DOCUMENT_KEY: ${{ secrets.SOURCE_DOCUMENT_KEY }}
        run: test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$SOURCE_DOCUMENT_KEY"
      - name: Configure source document secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_KHA_PROJECT }}
          SOURCE_DOCUMENT_KEY: ${{ secrets.SOURCE_DOCUMENT_KEY }}
        run: supabase secrets set SOURCE_DOCUMENT_KEY="$SOURCE_DOCUMENT_KEY" --project-ref enpovkaknaxfgzanyghn
      - name: Deploy source document function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_KHA_PROJECT }}
        run: supabase functions deploy source-document-api --project-ref enpovkaknaxfgzanyghn
