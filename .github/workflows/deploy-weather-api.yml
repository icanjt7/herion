name: Deploy Weather API Proxy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-weather-api.yml'
      - 'supabase/config.toml'
      - 'supabase/functions/weather-api/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_KHA_PROJECT }}
          MIDFCSTINFOSERVICE: ${{ secrets.MIDFCSTINFOSERVICE }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$MIDFCSTINFOSERVICE"

      - name: Configure KMA mid-term forecast secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_KHA_PROJECT }}
          MIDFCSTINFOSERVICE: ${{ secrets.MIDFCSTINFOSERVICE }}
        run: |
          supabase secrets set \
            MIDFCSTINFOSERVICE="$MIDFCSTINFOSERVICE" \
            --project-ref enpovkaknaxfgzanyghn

      - name: Deploy weather API function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_KHA_PROJECT }}
        run: supabase functions deploy weather-api --project-ref enpovkaknaxfgzanyghn
