name: Weekly Heritage Data Refresh

on:
  schedule:
    - cron: '0 18 * * 0'   # 매주 일요일 UTC 18:00 = KST 03:00
  workflow_dispatch:        # 수동 실행 가능

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh heritage data from 국가유산청 API
        env:
          KHS_API_KEY: ${{ secrets.KHS_API_KEY }}
        run: python convert_data.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || \
            git commit -m "chore: weekly heritage data refresh $(date +'%Y-%m-%d') [skip ci]"
          git push
