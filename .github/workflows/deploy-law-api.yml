name: Deploy Law API Proxy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-law-api.yml'
      - 'supabase/config.toml'
      - 'supabase/functions/law-api/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_KHA_PROJECT }}
          LAW_API_OC: ${{ secrets.LAW_API }}
        run: test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$LAW_API_OC"

      - name: Configure law API secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_KHA_PROJECT }}
          LAW_API_OC: ${{ secrets.LAW_API }}
        run: supabase secrets set LAW_API_OC="$LAW_API_OC" --project-ref enpovkaknaxfgzanyghn

      - name: Deploy law API function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_KHA_PROJECT }}
        run: supabase functions deploy law-api --project-ref enpovkaknaxfgzanyghn
