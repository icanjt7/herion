<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Herion — 로그인</title>
  <style>
    :root {
      font-family: Inter, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      --accent: #19715f;
      --accent-h: #14604f;
      --line: #d9dee7;
      --text: #1c2430;
      --muted: #657386;
      --bg: #f0f2f5;
      --panel: #ffffff;
      --err: #c0392b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 20px 48px rgba(21,32,46,.10);
      padding: 44px 44px 40px;
      width: 100%;
      max-width: 420px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .mark {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2bb58f, #2864bb);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      font-size: 18px;
    }

    .brand-text h1 { font-size: 20px; font-weight: 760; color: var(--text); }
    .brand-text p  { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .divider {
      border: none;
      border-top: 1px solid var(--line);
      margin: 0 0 24px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 7px;
    }

    input[type="email"] {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 14px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color .15s;
    }
    input[type="email"]:focus { border-color: var(--accent); }

    .hint {
      margin-top: 7px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .domain-badge {
      background: #e6f4f1;
      color: var(--accent);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 650;
    }

    .btn-primary {
      margin-top: 22px;
      width: 100%;
      height: 44px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 650;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-primary:hover { background: var(--accent-h); }

    .notice {
      margin-top: 20px;
      background: #fef8ec;
      border: 1px solid #f5dfa0;
      border-radius: 8px;
      padding: 13px 14px;
      font-size: 12.5px;
      color: #7a5500;
      line-height: 1.6;
    }

    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="mark">H</div>
      <div class="brand-text">
        <h1>Herion</h1>
        <p>국가유산 AI 업무 보조 서비스</p>
      </div>
    </div>
    <hr class="divider" />

    <label for="email">기관 이메일 주소</label>
    <input type="email" id="email" placeholder="이름@kh.or.kr" autocomplete="email" />
    <div class="hint">
      <span>접속 허용 도메인</span>
      <span class="domain-badge">@kh.or.kr</span>
    </div>

    <button class="btn-primary" onclick="location.href='index.html'">로그인 링크 받기</button>

    <div class="notice">
      이 서비스는 <strong>한국문화재재단 임직원 전용</strong>입니다.<br>
      기관 이메일로 로그인 링크를 발송합니다. 가입 후 관리자 승인이 완료되면 이용하실 수 있습니다.
    </div>

    <div class="footer">문의: 디지털혁신팀 | <a href="admin.html" style="color:inherit;text-decoration:none;">관리자</a></div>
  </div>
</body>
</html>
