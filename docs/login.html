<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Herion — 로그인</title>
  <style>
    :root {
      font-family: Inter, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      --accent: #19715f;
      --accent-h: #14604f;
      --line: #d9dee7;
      --text: #1c2430;
      --muted: #657386;
      --bg: #f0f2f5;
      --panel: #ffffff;
      --err: #c0392b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 20px 48px rgba(21,32,46,.10);
      padding: 44px 44px 40px;
      width: 100%;
      max-width: 420px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .mark {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2bb58f, #2864bb);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      font-size: 18px;
    }

    .brand-text h1 { font-size: 20px; font-weight: 760; color: var(--text); }
    .brand-text p  { font-size: 12px; color: var(--muted); margin-top: 2px; }

    hr { border: none; border-top: 1px solid var(--line); margin: 0 0 24px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 7px;
    }

    input[type="email"] {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 14px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color .15s;
    }
    input[type="email"]:focus { border-color: var(--accent); }
    input[type="email"].error { border-color: var(--err); }

    .hint {
      margin-top: 7px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .domain-badge {
      background: #e6f4f1;
      color: var(--accent);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 650;
    }

    .err-msg {
      margin-top: 8px;
      font-size: 12.5px;
      color: var(--err);
      display: none;
    }

    .btn-primary {
      margin-top: 22px;
      width: 100%;
      height: 44px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 650;
      cursor: pointer;
      transition: background .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-h); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Success state */
    .success-box {
      display: none;
      text-align: center;
      padding: 8px 0;
    }

    .success-icon {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: #e6f4f1;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      font-size: 26px;
    }

    .success-box h2 { font-size: 17px; margin-bottom: 8px; }
    .success-box p  { font-size: 13.5px; color: var(--muted); line-height: 1.6; }

    .email-highlight {
      font-weight: 650;
      color: var(--text);
    }

    .resend-row {
      margin-top: 20px;
      font-size: 12.5px;
      color: var(--muted);
      text-align: center;
    }

    .resend-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 12.5px;
      cursor: pointer;
      padding: 0;
      font-weight: 600;
    }

    .notice {
      margin-top: 20px;
      background: #fef8ec;
      border: 1px solid #f5dfa0;
      border-radius: 8px;
      padding: 13px 14px;
      font-size: 12.5px;
      color: #7a5500;
      line-height: 1.6;
    }

    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    /* Config warning */
    .config-warn {
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 12.5px;
      color: #664d03;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="mark">H</div>
      <div class="brand-text">
        <h1>Herion</h1>
        <p>국가유산 AI 업무 보조 서비스</p>
      </div>
    </div>
    <hr />

    <!-- Config not set warning -->
    <div class="config-warn" id="configWarn">
      ⚠️ Supabase 설정이 아직 입력되지 않았습니다. <code>config.js</code>에 프로젝트 URL과 키를 입력해 주세요.
    </div>

    <!-- Login form -->
    <div id="loginForm">
      <label for="email">기관 이메일 주소</label>
      <input type="email" id="email" placeholder="이름@kh.or.kr" autocomplete="email" />
      <div class="hint">
        접속 허용 도메인&nbsp;<span class="domain-badge">@kh.or.kr</span>
      </div>
      <div class="err-msg" id="errMsg"></div>

      <button class="btn-primary" id="loginBtn" onclick="sendMagicLink()">
        <span class="spinner" id="spinner"></span>
        <span id="btnText">로그인 링크 받기</span>
      </button>

      <div class="notice">
        이 서비스는 <strong>한국문화재재단 임직원 전용</strong>입니다.<br>
        기관 이메일로 로그인 링크를 발송합니다. 가입 후 관리자 승인이 완료되면 이용하실 수 있습니다.
      </div>
    </div>

    <!-- Success state -->
    <div class="success-box" id="successBox">
      <div class="success-icon">✉️</div>
      <h2>이메일을 확인해 주세요</h2>
      <p>
        <span class="email-highlight" id="sentEmail"></span>으로<br>
        로그인 링크를 발송했습니다.<br>
        링크는 <strong>10분간</strong> 유효합니다.
      </p>
      <div class="resend-row">
        링크를 받지 못하셨나요?
        <button class="resend-btn" onclick="resetForm()">다시 시도</button>
      </div>
    </div>

    <div class="footer">문의: 디지털혁신팀 &nbsp;·&nbsp; <a href="admin.html" style="color:inherit;text-decoration:none;">관리자</a></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script>
    const cfg = window.HERION_CONFIG;
    let sb;

    // Warn if config is placeholder
    if (!cfg || cfg.supabaseUrl.includes('XXXXXXXXXX')) {
      document.getElementById('configWarn').style.display = 'block';
    } else {
      sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
      // If already logged in, go straight to app
      sb.auth.getSession().then(({ data: { session } }) => {
        if (session) location.href = 'index.html';
      });
    }

    async function sendMagicLink() {
      const emailEl = document.getElementById('email');
      const errEl   = document.getElementById('errMsg');
      const btn     = document.getElementById('loginBtn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btnText');
      const email   = emailEl.value.trim().toLowerCase();

      // Reset
      emailEl.classList.remove('error');
      errEl.style.display = 'none';

      // Domain check
      if (!email) {
        showErr(emailEl, errEl, '이메일을 입력해 주세요.');
        return;
      }
      if (!email.endsWith('@' + cfg.allowedDomain)) {
        showErr(emailEl, errEl, `@${cfg.allowedDomain} 주소만 사용할 수 있습니다.`);
        return;
      }

      if (!sb) {
        showErr(emailEl, errEl, 'Supabase 설정이 완료되지 않았습니다.');
        return;
      }

      // Loading
      btn.disabled = true;
      spinner.style.display = 'block';
      btnText.textContent = '발송 중...';

      const { error } = await sb.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: cfg.redirectTo }
      });

      spinner.style.display = 'none';
      btn.disabled = false;
      btnText.textContent = '로그인 링크 받기';

      if (error) {
        showErr(emailEl, errEl, '발송 실패: ' + error.message);
        return;
      }

      // Show success
      document.getElementById('sentEmail').textContent = email;
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('successBox').style.display = 'block';
    }

    function showErr(inputEl, errEl, msg) {
      inputEl.classList.add('error');
      errEl.textContent = msg;
      errEl.style.display = 'block';
      inputEl.focus();
    }

    function resetForm() {
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('successBox').style.display = 'none';
      document.getElementById('email').value = '';
      document.getElementById('email').focus();
    }

    // Allow Enter key
    document.getElementById('email')?.addEventListener('keydown', e => {
      if (e.key === 'Enter') sendMagicLink();
    });
  </script>
</body>
</html>
