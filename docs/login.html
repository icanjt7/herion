<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Herion — 로그인</title>
  <style>
    :root {
      font-family: Inter, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      --accent: #19715f;
      --accent-h: #14604f;
      --line: #d9dee7;
      --text: #1c2430;
      --muted: #657386;
      --bg: #f0f2f5;
      --panel: #ffffff;
      --err: #c0392b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 20px 48px rgba(21,32,46,.10);
      padding: 44px 44px 40px;
      width: 100%;
      max-width: 420px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .mark {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2bb58f, #2864bb);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      font-size: 18px;
    }

    .brand-text h1 { font-size: 20px; font-weight: 760; color: var(--text); }
    .brand-text p  { font-size: 12px; color: var(--muted); margin-top: 2px; }

    hr { border: none; border-top: 1px solid var(--line); margin: 0 0 24px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 7px;
    }

    input[type="email"] {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 14px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color .15s;
    }
    input[type="email"]:focus { border-color: var(--accent); }
    input[type="email"].error { border-color: var(--err); }

    .hint {
      margin-top: 7px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .domain-badge {
      background: #e6f4f1;
      color: var(--accent);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 650;
    }

    .err-msg {
      margin-top: 8px;
      font-size: 12.5px;
      color: var(--err);
      display: none;
    }

    .btn-primary {
      margin-top: 22px;
      width: 100%;
      height: 44px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 650;
      cursor: pointer;
      transition: background .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-h); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .notice {
      margin-top: 20px;
      background: #f0f7f5;
      border: 1px solid #c7e1d9;
      border-radius: 8px;
      padding: 13px 14px;
      font-size: 12.5px;
      color: #1a5449;
      line-height: 1.6;
    }

    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    .config-warn {
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 12.5px;
      color: #664d03;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="mark">H</div>
      <div class="brand-text">
        <h1>Herion</h1>
        <p>국가유산진흥원 AI 업무 보조 서비스</p>
      </div>
    </div>
    <hr />

    <div class="config-warn" id="configWarn">
      ⚠️ Supabase 설정이 아직 입력되지 않았습니다. <code>config.js</code>에 프로젝트 URL과 키를 입력해 주세요.
    </div>

    <label for="email">기관 이메일 주소</label>
    <input type="email" id="email" placeholder="이름@kh.or.kr" autocomplete="email" />
    <div class="hint">
      접속 허용 도메인&nbsp;<span class="domain-badge">@kh.or.kr</span>
    </div>
    <div class="err-msg" id="errMsg"></div>

    <button class="btn-primary" id="loginBtn" onclick="checkEmail()">
      <span class="spinner" id="spinner"></span>
      <span id="btnText">입장하기</span>
    </button>

    <div class="notice">
      이 서비스는 <strong>국가유산진흥원 임직원 전용</strong>입니다.<br>
      등록된 기관 이메일 입력 후 바로 이용할 수 있습니다.<br>
      미등록 이메일은 관리자에게 문의하세요.
    </div>

    <div class="footer">문의: AI미디어센터 AI데이터팀 &nbsp;·&nbsp; <a href="admin.html" style="color:inherit;text-decoration:none;">관리자</a></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script>
    const cfg = window.HERION_CONFIG;
    let sb;

    if (!cfg || cfg.supabaseUrl.includes('XXXXXXXXXX')) {
      document.getElementById('configWarn').style.display = 'block';
    } else {
      sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
      if (sessionStorage.getItem('herion_user')) location.href = 'index.html';
    }

    async function checkEmail() {
      const emailEl = document.getElementById('email');
      const errEl   = document.getElementById('errMsg');
      const btn     = document.getElementById('loginBtn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btnText');
      const email   = emailEl.value.trim().toLowerCase();

      emailEl.classList.remove('error');
      errEl.style.display = 'none';

      if (!email) {
        showErr(emailEl, errEl, '이메일을 입력해 주세요.');
        return;
      }
      if (!email.endsWith('@' + cfg.allowedDomain)) {
        showErr(emailEl, errEl, `@${cfg.allowedDomain} 주소만 사용할 수 있습니다.`);
        return;
      }
      if (!sb) {
        showErr(emailEl, errEl, 'Supabase 설정이 완료되지 않았습니다.');
        return;
      }

      btn.disabled = true;
      spinner.style.display = 'block';
      btnText.textContent = '확인 중...';

      const { data, error } = await sb
        .from('employees')
        .select('email, name, role')
        .eq('email', email)
        .single();

      spinner.style.display = 'none';
      btn.disabled = false;
      btnText.textContent = '입장하기';

      if (error || !data) {
        showErr(emailEl, errEl, '등록되지 않은 이메일입니다. 관리자에게 문의하세요.');
        return;
      }

      sessionStorage.setItem('herion_user', JSON.stringify(data));
      location.href = 'index.html';
    }

    function showErr(inputEl, errEl, msg) {
      inputEl.classList.add('error');
      errEl.textContent = msg;
      errEl.style.display = 'block';
      inputEl.focus();
    }

    document.getElementById('email').addEventListener('keydown', e => {
      if (e.key === 'Enter') checkEmail();
    });
  </script>
</body>
</html>
