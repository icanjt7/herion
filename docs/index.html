<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Herion — 국가유산진흥원 AI 업무 보조</title>
  <style>
    :root {
      font-family: Inter, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-2: #eef2f6;
      --line: #d9dee7;
      --text: #1c2430;
      --muted: #657386;
      --accent: #19715f;
      --accent-2: #2457a6;
      --warn: #a65f12;
      --sidebar: #18202b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body { background: var(--bg); color: var(--text); min-height: 100vh; }

    .app {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: 100vh;
    }

    /* Sidebar */
    aside {
      background: var(--sidebar);
      color: #eef3f8;
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      gap: 3px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 4px 6px 14px;
      border-bottom: 1px solid rgba(255,255,255,.1);
      margin-bottom: 6px;
      font-weight: 760;
      font-size: 17px;
    }

    .mark {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2bb58f, #2864bb);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 14px;
    }

    .new-chat {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.08);
      color: #fff;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 4px;
    }

    .nav-section {
      font-size: 10px;
      text-transform: uppercase;
      color: #6b7e94;
      padding: 10px 8px 4px;
      letter-spacing: .06em;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
      border-radius: 7px;
      font-size: 13px;
      color: #c4cdd8;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-item:hover, .chat-item.active {
      background: rgba(255,255,255,.1);
      color: #fff;
    }

    .chat-item .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex: 0 0 auto;
    }

    .sidebar-footer {
      margin-top: auto;
      border-top: 1px solid rgba(255,255,255,.1);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .footer-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 7px;
      font-size: 13px;
      color: #9facbb;
      cursor: pointer;
      text-decoration: none;
    }

    .footer-link:hover { background: rgba(255,255,255,.08); color: #fff; }

    .user-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      color: #c4cdd8;
      font-size: 12.5px;
    }

    .avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--accent);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      flex: 0 0 auto;
    }

    /* Main */
    main {
      display: grid;
      grid-template-rows: 56px 1fr auto;
      min-width: 0;
      min-height: 100vh;
    }

    /* Header */
    header {
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-title { font-size: 15px; font-weight: 650; }
    .header-sub   { font-size: 12px; color: var(--muted); }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .model-select {
      height: 32px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 7px;
      padding: 0 10px;
      font-size: 12.5px;
      color: var(--text);
    }

    .icon-btn {
      width: 32px; height: 32px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 7px;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 14px;
      color: var(--muted);
    }

    /* Conversation area */
    .workspace {
      overflow-y: auto;
      padding: 28px 0;
    }

    .conv-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px;
      display: grid;
      gap: 28px;
    }

    /* Message */
    .msg { display: grid; gap: 8px; }

    .msg-header {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 650;
    }

    .msg-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 12px;
    }

    .msg.user .msg-avatar  { background: var(--accent); color: #fff; }
    .msg.ai   .msg-avatar  { background: #dfe8f4; color: var(--accent-2); }

    .msg-body {
      margin-left: 37px;
      font-size: 14.5px;
      line-height: 1.7;
    }

    /* Markdown-like styles inside msg-body */
    .msg-body p { margin-bottom: .6em; }
    .msg-body p:last-child { margin-bottom: 0; }

    .msg-body h3 {
      font-size: 15px;
      font-weight: 700;
      margin: 1em 0 .4em;
    }

    .msg-body ul, .msg-body ol {
      padding-left: 1.4em;
      margin-bottom: .7em;
    }

    .msg-body li { margin-bottom: .3em; }

    .msg-body strong { font-weight: 700; }

    .msg-body code {
      background: #eef2f6;
      border: 1px solid #dde3ec;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 13px;
      font-family: "Fira Code", "Consolas", monospace;
    }

    .code-block {
      background: #1c2430;
      color: #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      margin: 10px 0;
      font-size: 13px;
      font-family: "Fira Code", "Consolas", monospace;
    }

    .code-block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: rgba(255,255,255,.07);
      font-size: 12px;
      color: #94a3b8;
    }

    .code-block pre {
      padding: 14px;
      overflow-x: auto;
      line-height: 1.6;
    }

    .copy-btn {
      border: 1px solid rgba(255,255,255,.2);
      background: transparent;
      color: #94a3b8;
      border-radius: 5px;
      padding: 2px 8px;
      font-size: 11px;
      cursor: pointer;
    }

    .msg-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .action-pill {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
    }

    .action-pill:hover { background: var(--panel-2); color: var(--text); }

    /* File attach preview */
    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 12.5px;
      margin-bottom: 8px;
    }

    /* Thinking indicator */
    .thinking {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      font-style: italic;
    }

    .dot-anim span {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite ease-in-out;
    }

    .dot-anim span:nth-child(2) { animation-delay: .2s; }
    .dot-anim span:nth-child(3) { animation-delay: .4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: .5; }
      40%            { transform: scale(1);   opacity: 1; }
    }

    /* Divider */
    .day-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .day-divider::before, .day-divider::after {
      content: '';
      flex: 1;
      border-top: 1px solid var(--line);
    }

    /* Composer */
    .composer {
      border-top: 1px solid var(--line);
      background: var(--bg);
      padding: 14px 24px 18px;
    }

    .composer-inner {
      max-width: 760px;
      margin: 0 auto;
    }

    .attach-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .attach-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
    }

    .input-shell {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(21,32,46,.06);
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: end;
      padding: 8px 10px;
      gap: 6px;
    }

    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 12.5px;
    }

    .file-chip button {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      padding: 0;
      line-height: 1;
    }

    .attach-btn {
      width: 34px; height: 34px;
      border: 1px solid var(--line);
      background: transparent;
      border-radius: 7px;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 16px;
      color: var(--muted);
      align-self: flex-end;
    }

    textarea {
      border: 0;
      outline: 0;
      resize: none;
      font-size: 14.5px;
      color: var(--text);
      font-family: inherit;
      line-height: 1.5;
      min-height: 34px;
      max-height: 200px;
      padding: 6px 4px;
      background: transparent;
    }

    textarea::placeholder { color: #9aa5b4; }

    .send-btn {
      width: 34px; height: 34px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      display: grid;
      place-items: center;
      align-self: flex-end;
    }

    .composer-hint {
      text-align: center;
      font-size: 11.5px;
      color: #aab5c3;
      margin-top: 10px;
    }

    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      aside { display: none; }
      header { padding: 0 16px; }
      .composer { padding: 12px 16px 16px; }
      .conv-inner { padding: 0 16px; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <aside>
    <div class="brand">
      <div class="mark">H</div>
      <span>Herion</span>
    </div>

    <button class="new-chat" id="newChatBtn">＋&nbsp; 새 대화</button>

    <div id="convList" style="flex:1;overflow-y:auto;"></div>

    <div class="sidebar-footer">
      <a href="admin.html" class="footer-link" id="adminLink" style="display:none;">📊 관리자 대시보드</a>
      <button class="footer-link" onclick="logout()" style="background:none;border:none;width:100%;text-align:left;cursor:pointer;">🚪 로그아웃</button>
      <div class="user-row">
        <div class="avatar" id="userInitial">?</div>
        <div>
          <div style="font-weight:600;" id="userName">로딩 중...</div>
          <div style="color:#8a96a3;font-size:11px;" id="userEmail"></div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main>
    <header>
      <div>
        <div class="header-title" id="chatTitle">새 대화</div>
        <div class="header-sub">국가유산진흥원 전용 AI 업무 보조</div>
      </div>
      <div class="toolbar">
        <select class="model-select" id="modelSelect">
          <option value="motif-12.7b-reasoning">Motif 12.7B Reasoning</option>
        </select>
      </div>
    </header>

    <section class="workspace" id="workspace">
      <div class="conv-inner" id="convInner"></div>
    </section>

    <!-- Composer -->
    <footer class="composer">
      <div class="composer-inner">
        <div id="filePreview" style="display:none;margin-bottom:8px;gap:6px;flex-wrap:wrap;"></div>
        <div class="input-shell">
          <button class="attach-btn" id="fileBtn" title="파일 첨부 (PDF·DOCX·PPTX·HWPX·TXT)">📎</button>
          <input type="file" id="fileInput" style="display:none"
                 accept=".pdf,.docx,.doc,.pptx,.ppt,.hwpx,.txt,.csv,.md" multiple>
          <textarea rows="1" id="msgInput" placeholder="Herion에게 국가유산진흥원 업무를 요청하세요..."></textarea>
          <button class="send-btn" id="sendBtn">↑</button>
        </div>
        <div class="composer-hint">
          PDF·DOCX·PPTX·HWPX 파일을 첨부해 분석을 요청할 수 있습니다.
          &nbsp;·&nbsp; 문의: AI미디어센터 AI데이터팀
          &nbsp;·&nbsp; <a href="admin.html" style="color:inherit;">관리자</a>
        </div>
      </div>
    </footer>
  </main>

</div>

<!-- 파일 파싱 라이브러리 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="config.js"></script>
<script>
// ─── 세션 확인 ───────────────────────────────────────────────
const cfg  = window.HERION_CONFIG;
const user = JSON.parse(sessionStorage.getItem('herion_user') || 'null');
if (!user) { location.href = 'login.html'; }
else {
  document.getElementById('userEmail').textContent   = user.email;
  document.getElementById('userName').textContent    = user.name;
  document.getElementById('userInitial').textContent = user.name[0].toUpperCase();
  if (user.role === 'admin') document.getElementById('adminLink').style.display = 'flex';
}
function logout() { sessionStorage.removeItem('herion_user'); location.href = 'login.html'; }

// ─── 대화 저장소 ─────────────────────────────────────────────
const CONVS_KEY = 'herion_convs_v1';
const CURR_KEY  = 'herion_curr_v1';

const getConvs  = () => JSON.parse(localStorage.getItem(CONVS_KEY) || '[]');
const setConvs  = v  => localStorage.setItem(CONVS_KEY, JSON.stringify(v));
const getCurrId = () => localStorage.getItem(CURR_KEY);
const setCurrId = id => id ? localStorage.setItem(CURR_KEY, id) : localStorage.removeItem(CURR_KEY);

// ─── DOM 참조 ────────────────────────────────────────────────
const convInner  = document.getElementById('convInner');
const workspace  = document.getElementById('workspace');
const convList   = document.getElementById('convList');
const textarea   = document.getElementById('msgInput');
const sendBtn    = document.getElementById('sendBtn');
const newChatBtn = document.getElementById('newChatBtn');
const chatTitle  = document.getElementById('chatTitle');

// ─── 상태 ────────────────────────────────────────────────────
let currentConvId = null;
let chatHistory   = [];
let isStreaming   = false;

// ─── 유틸 ────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderMd(text) {
  return text
    .replace(/```([\s\S]*?)```/g, (_, c) => `<div class="code-block"><pre>${escHtml(c.trim())}</pre></div>`)
    .replace(/`([^`]+)`/g, (_, c) => `<code>${escHtml(c)}</code>`)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm,  '<h3>$1</h3>')
    .replace(/^- (.+)$/gm,   '<li>$1</li>')
    .replace(/(<li>[\s\S]+?<\/li>)/g, '<ul>$1</ul>')
    .replace(/\n{2,}/g, '</p><p>')
    .replace(/^(?!<[hup\/]|<div)(.+)$/gm, '<p>$1</p>');
}

// ─── 사이드바 렌더링 ─────────────────────────────────────────
function renderSidebar() {
  const convs = getConvs().sort((a, b) => b.updatedAt - a.updatedAt);
  const now        = Date.now();
  const todayStart = new Date().setHours(0, 0, 0, 0);
  const weekStart  = todayStart - 6 * 86400000;

  const groups = [
    { label: '오늘',    items: convs.filter(c => c.updatedAt >= todayStart) },
    { label: '이번 주', items: convs.filter(c => c.updatedAt >= weekStart && c.updatedAt < todayStart) },
    { label: '이전',    items: convs.filter(c => c.updatedAt < weekStart) },
  ];

  convList.innerHTML = groups
    .filter(g => g.items.length)
    .map(g => `
      <div class="nav-section">${g.label}</div>
      ${g.items.map(c => `
        <div class="chat-item ${c.id === currentConvId ? 'active' : ''}"
             onclick="loadConversation('${c.id}')"
             title="${escHtml(c.title)}">
          <span class="dot"></span>
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;">${escHtml(c.title)}</span>
          <span onclick="deleteConversation(event,'${c.id}')"
                style="opacity:0;padding:0 4px;font-size:11px;color:#6b7e94;"
                class="del-btn">✕</span>
        </div>`).join('')}
    `).join('');
}

// 삭제 버튼 호버 표시
document.addEventListener('mouseover', e => {
  const item = e.target.closest('.chat-item');
  if (item) item.querySelector('.del-btn')?.style.setProperty('opacity','1');
});
document.addEventListener('mouseout', e => {
  const item = e.target.closest('.chat-item');
  if (item) item.querySelector('.del-btn')?.style.setProperty('opacity','0');
});

function deleteConversation(e, id) {
  e.stopPropagation();
  const convs = getConvs().filter(c => c.id !== id);
  setConvs(convs);
  if (currentConvId === id) showWelcome();
  else renderSidebar();
}

// ─── 환영 화면 ───────────────────────────────────────────────
function showWelcome() {
  currentConvId = null;
  chatHistory   = [];
  setCurrId(null);
  chatTitle.textContent = '새 대화';
  convInner.innerHTML = `
    <div style="text-align:center;padding:80px 0 40px;color:var(--muted);">
      <div style="width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#2bb58f,#2864bb);
                  display:grid;place-items:center;margin:0 auto 20px;color:#fff;font-size:22px;font-weight:800;">H</div>
      <div style="font-size:19px;font-weight:700;color:var(--text);margin-bottom:8px;">Herion에 오신 것을 환영합니다</div>
      <div style="font-size:14px;line-height:1.7;">국가유산진흥원 업무를 AI로 더 빠르게<br>안내문 작성, 번역, 보고서 요약을 시작해 보세요.</div>
    </div>`;
  renderSidebar();
}

// ─── 대화 불러오기 ───────────────────────────────────────────
function loadConversation(id) {
  const conv = getConvs().find(c => c.id === id);
  if (!conv) return;

  currentConvId = id;
  chatHistory   = [...conv.messages];
  setCurrId(id);
  chatTitle.textContent = conv.title;

  convInner.innerHTML = '';
  conv.messages.forEach(m => {
    const bodyEl = appendMsgEl(m.role);
    bodyEl.innerHTML = m.role === 'user' ? `<p>${escHtml(m.content)}</p>` : renderMd(m.content);
  });

  workspace.scrollTop = workspace.scrollHeight;
  renderSidebar();
}

// ─── 메시지 DOM 추가 ─────────────────────────────────────────
function appendMsgEl(role) {
  const isAI  = role === 'assistant';
  const now   = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  const avatar = isAI ? 'H' : (user?.name?.[0]?.toUpperCase() || 'U');
  const name   = isAI ? 'Herion' : (user?.name || '사용자');

  const div = document.createElement('div');
  div.className = `msg ${isAI ? 'ai' : 'user'}`;
  div.innerHTML = `
    <div class="msg-header">
      <div class="msg-avatar">${escHtml(avatar)}</div>
      <span>${escHtml(name)}</span>
      <span style="color:var(--muted);font-size:12px;">${now}</span>
    </div>
    <div class="msg-body"></div>`;
  convInner.appendChild(div);
  workspace.scrollTop = workspace.scrollHeight;
  return div.querySelector('.msg-body');
}

function appendThinking() {
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = `
    <div class="msg-header"><div class="msg-avatar">H</div><span>Herion</span></div>
    <div class="msg-body">
      <div class="thinking">
        <div class="dot-anim"><span></span><span></span><span></span></div>생각 중...
      </div>
    </div>`;
  convInner.appendChild(div);
  workspace.scrollTop = workspace.scrollHeight;
  return div;
}

// ─── 입력 이벤트 ─────────────────────────────────────────────
newChatBtn.addEventListener('click', showWelcome);

textarea.addEventListener('input', () => {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
});

textarea.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

sendBtn.addEventListener('click', sendMessage);

// ─── 메시지 전송 ─────────────────────────────────────────────
const SYSTEM_PROMPT = `당신은 국가유산진흥원 업무 전문 AI 보조 'Herion'입니다.
국가유산진흥원 임직원들이 안내문·설명문 작성, 번역(한↔영), 보고서 요약, Q&A 자료 제작 등의 업무를 수행할 수 있도록 전문적이고 정확하게 도와주세요.
공식 문서 작성 시 국가유산 분야 표준 용어를 사용하고, 기본적으로 한국어로 답변하세요.`;

async function sendMessage() {
  if (isStreaming) return;
  const text = textarea.value.trim();
  if (!text) return;

  if (!cfg?.motifApiKey || cfg.motifApiKey === 'YOUR_MOTIF_API_KEY') {
    alert('config.js에 Motif API 키를 입력해주세요.');
    return;
  }

  // 새 대화 생성
  if (!currentConvId) {
    const id   = Date.now().toString();
    const title = text.length > 28 ? text.slice(0, 28) + '…' : text;
    const convs = getConvs();
    convs.unshift({ id, title, messages: [], updatedAt: Date.now() });
    setConvs(convs);
    currentConvId = id;
    setCurrId(id);
    chatTitle.textContent = title;
    convInner.innerHTML = '';
    renderSidebar();
  }

  textarea.value = '';
  textarea.style.height = 'auto';
  isStreaming = true;
  sendBtn.disabled = true;

  // 첨부 파일 텍스트 포함
  const fileText    = attachedFiles.map(f => `\n\n[첨부파일: ${f.name}]\n${f.content}`).join('');
  const fullContent = fileText ? `${text}${fileText}` : text;

  chatHistory.push({ role: 'user', content: fullContent });
  const userBodyEl = appendMsgEl('user');
  userBodyEl.innerHTML = `<p>${escHtml(text)}</p>` +
    attachedFiles.map(f => `<div class="file-chip">📄 ${escHtml(f.name)}</div>`).join('');
  clearAttachments();

  const thinkEl = appendThinking();
  const model   = document.getElementById('modelSelect')?.value || 'motif-12.7b-reasoning';

  try {
    const resp = await fetch(`${cfg.motifBaseUrl}/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${cfg.motifApiKey}` },
      body: JSON.stringify({
        model,
        messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...chatHistory],
        stream: true
      })
    });

    if (!resp.ok) throw new Error(`API 오류 ${resp.status}: ${await resp.text()}`);

    thinkEl.remove();
    const bodyEl  = appendMsgEl('assistant');
    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let full = '', buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try {
          const chunk = JSON.parse(data).choices?.[0];
          const delta = chunk?.delta?.content ?? chunk?.message?.content;
          if (delta) {
            full += delta;
            bodyEl.textContent = full;
            workspace.scrollTop = workspace.scrollHeight;
          }
        } catch (_) {}
      }
    }

    bodyEl.innerHTML = renderMd(full);
    chatHistory.push({ role: 'assistant', content: full });

    // localStorage에 저장
    const convs = getConvs();
    const idx   = convs.findIndex(c => c.id === currentConvId);
    if (idx >= 0) {
      convs[idx].messages  = [...chatHistory];
      convs[idx].updatedAt = Date.now();
      setConvs(convs);
    }
    renderSidebar();

  } catch (err) {
    thinkEl.remove();
    const bodyEl = appendMsgEl('assistant');
    bodyEl.innerHTML = `<p style="color:var(--danger);">오류: ${escHtml(err.message)}</p>`;
  } finally {
    isStreaming = false;
    sendBtn.disabled = false;
    textarea.focus();
  }
}

// ─── 파일 첨부 ───────────────────────────────────────────────
let attachedFiles = [];  // [{name, content}]

const fileBtn     = document.getElementById('fileBtn');
const fileInput   = document.getElementById('fileInput');
const filePreview = document.getElementById('filePreview');

fileBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async () => {
  for (const file of fileInput.files) {
    try {
      const content = await extractText(file);
      attachedFiles.push({ name: file.name, content });
      renderFileChips();
    } catch (e) {
      alert(`${file.name}: ${e.message}`);
    }
  }
  fileInput.value = '';
});

function renderFileChips() {
  if (!attachedFiles.length) { filePreview.style.display = 'none'; return; }
  filePreview.style.display = 'flex';
  filePreview.innerHTML = attachedFiles.map((f, i) => `
    <div class="file-chip">
      📄 ${escHtml(f.name)}
      <button onclick="removeFile(${i})" title="제거">✕</button>
    </div>`).join('');
}

function removeFile(i) {
  attachedFiles.splice(i, 1);
  renderFileChips();
}

function clearAttachments() {
  attachedFiles = [];
  renderFileChips();
}

async function extractText(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  const MAX = 12000;

  if (['txt', 'md', 'csv'].includes(ext)) {
    const t = await file.text();
    return t.slice(0, MAX);
  }

  if (ext === 'pdf') {
    if (typeof pdfjsLib === 'undefined') throw new Error('PDF 라이브러리 로딩 중입니다. 잠시 후 다시 시도해주세요.');
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let text = '';
    for (let i = 1; i <= pdf.numPages && text.length < MAX; i++) {
      const page    = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(s => s.str).join(' ') + '\n';
    }
    return text.slice(0, MAX);
  }

  if (['docx', 'doc'].includes(ext)) {
    if (typeof mammoth === 'undefined') throw new Error('DOCX 라이브러리 로딩 중입니다.');
    const buf    = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer: buf });
    return result.value.slice(0, MAX);
  }

  if (['pptx', 'ppt'].includes(ext)) {
    if (typeof JSZip === 'undefined') throw new Error('ZIP 라이브러리 로딩 중입니다.');
    const buf  = await file.arrayBuffer();
    const zip  = await JSZip.loadAsync(buf);
    let text = '';
    const slides = Object.keys(zip.files)
      .filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n))
      .sort();
    for (const name of slides) {
      const xml = await zip.files[name].async('string');
      text += xml.replace(/<a:t>([^<]*)<\/a:t>/g, '$1 ').replace(/<[^>]+>/g, '') + '\n';
      if (text.length > MAX) break;
    }
    return text.slice(0, MAX) || '(텍스트를 추출하지 못했습니다)';
  }

  if (ext === 'hwpx') {
    if (typeof JSZip === 'undefined') throw new Error('ZIP 라이브러리 로딩 중입니다.');
    const buf = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(buf);
    let text = '';
    const sections = Object.keys(zip.files)
      .filter(n => /Contents\/section\d+\.xml/i.test(n))
      .sort();
    for (const name of sections) {
      const xml = await zip.files[name].async('string');
      text += xml.replace(/<hh:t[^>]*>([^<]*)<\/hh:t>/g, '$1 ').replace(/<[^>]+>/g, '') + '\n';
      if (text.length > MAX) break;
    }
    return text.slice(0, MAX) || '(텍스트를 추출하지 못했습니다)';
  }

  throw new Error(`지원하지 않는 형식입니다 (.${ext}). PDF·DOCX·PPTX·HWPX·TXT를 사용해주세요.`);
}

// ─── 초기화 ──────────────────────────────────────────────────
(function init() {
  const lastId = getCurrId();
  const convs  = getConvs();
  if (lastId && convs.find(c => c.id === lastId)) {
    loadConversation(lastId);
  } else {
    showWelcome();
  }
})();
</script>
