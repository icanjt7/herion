<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Herion — 국가유산진흥원 AI 업무 보조</title>
  <style>
    :root {
      font-family: Inter, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-2: #eef2f6;
      --line: #d9dee7;
      --text: #1c2430;
      --muted: #657386;
      --accent: #19715f;
      --accent-2: #2457a6;
      --accent-soft: #e9f1ff;
      --warn: #a65f12;
      --danger: #b3261e;
      --sidebar: #18202b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background:
        radial-gradient(circle at 65% 0%, rgba(66,133,244,.08), transparent 30%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .app {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: 100vh;
    }

    /* Sidebar */
    aside {
      background: var(--sidebar);
      color: #eef3f8;
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      gap: 3px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 4px 6px 14px;
      border-bottom: 1px solid rgba(255,255,255,.1);
      margin-bottom: 6px;
      font-weight: 760;
      font-size: 17px;
    }

    .mark {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2bb58f, #2864bb);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 14px;
    }

    .new-chat {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.08);
      color: #fff;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 4px;
    }

    .nav-section {
      font-size: 10px;
      text-transform: uppercase;
      color: #6b7e94;
      padding: 10px 8px 4px;
      letter-spacing: .06em;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
      border-radius: 7px;
      font-size: 13px;
      color: #c4cdd8;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-item:hover, .chat-item.active {
      background: rgba(255,255,255,.1);
      color: #fff;
    }

    .chat-item .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex: 0 0 auto;
    }

    .sidebar-footer {
      margin-top: auto;
      border-top: 1px solid rgba(255,255,255,.1);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .footer-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 7px;
      font-size: 13px;
      color: #9facbb;
      cursor: pointer;
      text-decoration: none;
    }

    .footer-link:hover { background: rgba(255,255,255,.08); color: #fff; }

    .user-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      color: #c4cdd8;
      font-size: 12.5px;
    }

    .avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--accent);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      flex: 0 0 auto;
    }

    /* Main */
    main {
      display: grid;
      grid-template-rows: 56px 1fr auto;
      min-width: 0;
      min-height: 100vh;
    }

    /* Header */
    header {
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-title { font-size: 15px; font-weight: 650; }
    .header-sub   { font-size: 12px; color: var(--muted); }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .model-select {
      height: 32px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 7px;
      padding: 0 10px;
      font-size: 12.5px;
      color: var(--text);
      font-weight: 600;
    }

    .icon-btn {
      width: 32px; height: 32px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 7px;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 14px;
      color: var(--muted);
    }

    /* Conversation area */
    .workspace {
      overflow-y: auto;
      padding: 28px 0;
    }

    .conv-inner {
      max-width: 840px;
      margin: 0 auto;
      padding: 0 24px;
      display: grid;
      gap: 28px;
    }

    /* Message */
    .msg { display: grid; gap: 8px; }

    .msg.ai {
      animation: message-in .22s ease-out;
    }

    @keyframes message-in {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-header {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 650;
    }

    .msg-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 12px;
    }

    .msg.user .msg-avatar  { background: var(--accent); color: #fff; }
    .msg.ai   .msg-avatar  {
      background: linear-gradient(135deg, #e8f0fe, #e9f7f3);
      color: var(--accent-2);
      box-shadow: inset 0 0 0 1px rgba(36,87,166,.08);
    }

    .msg-body {
      margin-left: 37px;
      font-size: 14.5px;
      line-height: 1.7;
    }

    /* Markdown-like styles inside msg-body */
    .msg-body p { margin-bottom: .6em; }
    .msg-body p:last-child { margin-bottom: 0; }

    .msg-body h3 {
      font-size: 15px;
      font-weight: 700;
      margin: 1em 0 .4em;
    }

    .msg-body ul, .msg-body ol {
      padding-left: 1.4em;
      margin-bottom: .7em;
    }

    .msg-body li { margin-bottom: .3em; }

    .msg-body strong { font-weight: 700; }

    .msg-body code {
      background: #eef2f6;
      border: 1px solid #dde3ec;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 13px;
      font-family: "Fira Code", "Consolas", monospace;
    }

    .code-block {
      background: #1c2430;
      color: #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      margin: 10px 0;
      font-size: 13px;
      font-family: "Fira Code", "Consolas", monospace;
    }

    .code-block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: rgba(255,255,255,.07);
      font-size: 12px;
      color: #94a3b8;
    }

    .code-block pre {
      padding: 14px;
      overflow-x: auto;
      line-height: 1.6;
    }

    .copy-btn {
      border: 1px solid rgba(255,255,255,.2);
      background: transparent;
      color: #94a3b8;
      border-radius: 5px;
      padding: 2px 8px;
      font-size: 11px;
      cursor: pointer;
    }

    .msg-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      opacity: .72;
      transition: opacity .18s ease;
    }

    .msg:hover .msg-actions { opacity: 1; }

    .action-pill {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
    }

    .action-pill:hover { background: var(--panel-2); color: var(--text); }

    .streaming-cursor {
      display: inline-block;
      width: 7px;
      height: 17px;
      margin-left: 3px;
      border-radius: 2px;
      vertical-align: -3px;
      background: linear-gradient(180deg, #4285f4, #34a853);
      animation: cursor-pulse .8s infinite;
    }

    @keyframes cursor-pulse { 50% { opacity: .25; } }

    .welcome {
      padding: 58px 0 34px;
      color: var(--muted);
    }

    .welcome-kicker {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px;
      border: 1px solid #d9e4f8;
      border-radius: 999px;
      background: rgba(255,255,255,.8);
      color: var(--accent-2);
      font-size: 12px;
      font-weight: 650;
      margin-bottom: 18px;
    }

    .welcome-title {
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.15;
      font-weight: 760;
      letter-spacing: -.035em;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #2457a6, #19715f 62%, #b06a22);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .welcome-subtitle { font-size: 15px; line-height: 1.7; }

    .suggestion-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 28px;
      text-align: left;
    }

    .suggestion-card {
      min-height: 112px;
      padding: 15px 16px;
      border: 1px solid #e0e5ec;
      border-radius: 16px;
      background: rgba(255,255,255,.86);
      box-shadow: 0 4px 18px rgba(37,57,88,.04);
      color: var(--text);
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .suggestion-card:hover {
      transform: translateY(-2px);
      border-color: #b9cae7;
      box-shadow: 0 9px 24px rgba(37,57,88,.09);
    }

    .suggestion-icon { display: block; font-size: 18px; margin-bottom: 11px; }
    .suggestion-title { display: block; font-size: 13.5px; font-weight: 700; margin-bottom: 4px; }
    .suggestion-desc { display: block; color: var(--muted); font-size: 12px; line-height: 1.45; }

    /* File attach preview */
    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 12.5px;
      margin-bottom: 8px;
    }

    /* Thinking indicator */
    .thinking {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      font-style: italic;
    }

    .dot-anim span {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite ease-in-out;
    }

    .dot-anim span:nth-child(2) { animation-delay: .2s; }
    .dot-anim span:nth-child(3) { animation-delay: .4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: .5; }
      40%            { transform: scale(1);   opacity: 1; }
    }

    /* Divider */
    .day-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .day-divider::before, .day-divider::after {
      content: '';
      flex: 1;
      border-top: 1px solid var(--line);
    }

    /* Composer */
    .composer {
      background: linear-gradient(180deg, rgba(246,247,249,0), var(--bg) 28%);
      padding: 14px 24px 18px;
    }

    .composer-inner {
      max-width: 840px;
      margin: 0 auto;
    }

    .attach-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .attach-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
    }

    .input-shell {
      position: relative;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 5px 24px rgba(21,32,46,.09);
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: end;
      padding: 9px 11px;
      gap: 6px;
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .input-shell.drag-active {
      border-color: #2b6bdc;
      background: #f4f8ff;
      box-shadow: 0 0 0 4px rgba(43,107,220,.12), 0 8px 26px rgba(21,32,46,.1);
    }

    .drop-overlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 5;
      border-radius: inherit;
      background: rgba(244,248,255,.96);
      color: #2457a6;
      font-size: 13.5px;
      font-weight: 700;
      align-items: center;
      justify-content: center;
      gap: 8px;
      pointer-events: none;
    }

    .input-shell.drag-active .drop-overlay { display: flex; }

    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 12.5px;
    }

    .file-chip button {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      padding: 0;
      line-height: 1;
    }

    .attach-btn {
      width: 34px; height: 34px;
      border: 1px solid var(--line);
      background: transparent;
      border-radius: 7px;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 16px;
      color: var(--muted);
      align-self: flex-end;
    }

    textarea {
      border: 0;
      outline: 0;
      resize: none;
      font-size: 14.5px;
      color: var(--text);
      font-family: inherit;
      line-height: 1.5;
      min-height: 34px;
      max-height: 200px;
      padding: 6px 4px;
      background: transparent;
    }

    textarea::placeholder { color: #9aa5b4; }

    .send-btn {
      width: 34px; height: 34px;
      border: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, #2b6bdc, #19715f);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      display: grid;
      place-items: center;
      align-self: flex-end;
    }

    .send-btn.stop {
      background: #2f3947;
      font-size: 11px;
    }

    .send-btn:disabled { opacity: .45; cursor: not-allowed; }

    .composer-hint {
      text-align: center;
      font-size: 11.5px;
      color: #aab5c3;
      margin-top: 10px;
    }

    /* ── 모바일 드로어 오버레이 ─────────────────────────── */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 45;
      cursor: pointer;
    }

    /* 햄버거 메뉴 버튼 */
    .menu-btn {
      display: none;
      width: 36px; height: 36px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      font-size: 20px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      line-height: 1;
    }

    /* 헤더에 노출할 모바일 전용 사용자 컨트롤 */
    .mobile-user {
      display: none;
      align-items: center;
      gap: 8px;
    }

    .mobile-logout-btn {
      height: 32px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 7px;
      padding: 0 11px;
      font-size: 12.5px;
      cursor: pointer;
      white-space: nowrap;
      color: var(--text);
    }

    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }

      /* 사이드바: 숨김 → 슬라이드 드로어 */
      aside {
        display: flex !important;
        position: fixed;
        left: -280px;
        top: 0;
        height: 100vh;
        width: 260px;
        z-index: 50;
        transition: left .25s cubic-bezier(.4,0,.2,1);
      }
      aside.open { left: 0; }
      .sidebar-overlay.open { display: block; }

      /* 햄버거 + 모바일 사용자 컨트롤 표시 */
      .menu-btn { display: flex; }
      .mobile-user { display: flex; }

      /* 모델 셀렉트 숨김 */
      .model-select { display: none; }

      /* 툴바 버튼 텍스트 숨기고 아이콘만 */
      .toolbar-label { display: none; }
      .icon-btn { padding: 0 9px; min-width: 36px; }

      header { padding: 0 12px; gap: 8px; }
      .composer { padding: 10px 12px 14px; }
      .conv-inner { padding: 0 14px; }
      .composer-hint { font-size: 10.5px; }
      .send-btn, .attach-btn { width: 40px; height: 40px; }
      .welcome { padding-top: 36px; }
      .suggestion-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<!-- 모바일 사이드바 오버레이 -->
<button class="sidebar-overlay" id="sidebarOverlay" aria-label="메뉴 닫기"
        onclick="closeSidebar()"></button>

<div class="app">

  <!-- Sidebar -->
  <aside>
    <div class="brand">
      <div class="mark">H</div>
      <span>Herion</span>
    </div>

    <button class="new-chat" id="newChatBtn">＋&nbsp; 새 대화</button>

    <div id="convList" style="flex:1;overflow-y:auto;"></div>

    <div class="sidebar-footer">
      <a href="admin.html" class="footer-link" id="adminLink" style="display:none;">📊 관리자 대시보드</a>
      <button class="footer-link" onclick="logout()" style="background:none;border:none;width:100%;text-align:left;cursor:pointer;">🚪 로그아웃</button>
      <div class="user-row">
        <div class="avatar" id="userInitial">?</div>
        <div>
          <div style="font-weight:600;" id="userName">로딩 중...</div>
          <div style="color:#8a96a3;font-size:11px;" id="userEmail"></div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main>
    <header>
      <div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1;">
        <button class="menu-btn" onclick="toggleSidebar()" aria-label="메뉴 열기">☰</button>
        <div style="min-width:0;">
          <div class="header-title" id="chatTitle">새 대화</div>
          <div class="header-sub">국가유산진흥원 전용 AI 업무 보조</div>
        </div>
      </div>
      <div class="toolbar">
        <select class="model-select" id="modelSelect">
          <option value="motif3">Motif3 300B</option>
        </select>
        <button class="icon-btn" id="webSearchBtn" title="웹 검색 (클릭하여 켜기)" onclick="toggleWebSearch()"
                style="font-size:15px;width:auto;padding:0 10px;gap:5px;display:flex;align-items:center;">
          🌐 <span class="toolbar-label" id="webSearchLabel" style="font-size:12px;color:var(--muted);">웹 검색</span>
        </button>
        <button class="icon-btn" title="한국어 맞춤법 검사" onclick="openSpellCheck()"
                style="font-size:15px;width:auto;padding:0 10px;gap:4px;display:flex;align-items:center;">
          ✍️ <span class="toolbar-label">맞춤법</span>
        </button>
        <button class="icon-btn" title="내 메모리 관리" onclick="openMemoryModal()"
                style="font-size:15px;width:auto;padding:0 10px;gap:4px;display:flex;align-items:center;">
          🧠 <span class="toolbar-label">메모리</span>
        </button>

        <!-- 모바일 전용: 사용자 아바타 + 로그아웃 -->
        <div class="mobile-user">
          <div class="avatar" id="mobileUserInitial"
               style="width:32px;height:32px;font-size:13px;cursor:default;flex:0 0 auto;">?</div>
          <button class="mobile-logout-btn" onclick="logout()">🚪 로그아웃</button>
        </div>
      </div>
    </header>

    <section class="workspace" id="workspace">
      <div class="conv-inner" id="convInner"></div>
    </section>

    <!-- Composer -->
    <footer class="composer">
      <div class="composer-inner">
        <div id="filePreview" style="display:none;margin-bottom:8px;gap:6px;flex-wrap:wrap;"></div>
        <div class="input-shell">
          <div class="drop-overlay" id="dropOverlay">📄 여기에 놓으면 파일이 첨부됩니다</div>
          <button class="attach-btn" id="fileBtn" title="파일 첨부 (PDF·DOCX·PPTX·HWPX·TXT)">📎</button>
          <input type="file" id="fileInput" style="display:none"
                 accept=".pdf,.docx,.doc,.pptx,.ppt,.hwpx,.txt,.csv,.md" multiple>
          <textarea rows="1" id="msgInput" placeholder="Herion에게 국가유산진흥원 업무를 요청하세요..."></textarea>

async function loadHeritageData() {
  try {
    const [h, r] = await Promise.allSettled([
      fetch('data/heritage.json').then(res => res.ok ? res.json() : Promise.reject()),
      fetch('data/royal.json').then(res => res.ok ? res.json() : Promise.reject())
    ]);
    if (h.status === 'fulfilled') heritageData = h.value;
    if (r.status === 'fulfilled') royalData    = r.value;
  } catch(_) {}
}

function searchHeritageContext(query) {
  if (!heritageData && !royalData) return '';
  const keywords = (query.match(/[가-힣a-zA-Z]{2,}/g) || []).filter(k => k.length >= 2);
  if (!keywords.length) return '';

  const score = (item, fields) =>
    keywords.filter(k => fields.some(f => item[f]?.includes(k))).length;

  const hMatches = heritageData
    ? heritageData
        .map(item => ({ item, s: score(item, ['name','content','location']) }))
        .filter(r => r.s > 0).sort((a,b) => b.s - a.s).slice(0,3).map(r => r.item)
    : [];
  const rMatches = royalData
    ? royalData
        .map(item => ({ item, s: score(item, ['name','place','content']) }))
        .filter(r => r.s > 0).sort((a,b) => b.s - a.s).slice(0,3).map(r => r.item)
    : [];

  if (!hMatches.length && !rMatches.length) return '';

  let ctx = '\n\n[참고: 관련 국가유산 데이터]\n다음 정보를 참고하여 정확하게 답변하세요:\n';
  hMatches.forEach(item => {
    ctx += `\n■ ${item.name}${item.type ? ` [${item.type}]` : ''}\n`;
    if (item.location) ctx += `위치: ${item.location}\n`;
    if (item.content)  ctx += `${item.content.slice(0, 300)}\n`;
  });
  rMatches.forEach(item => {
    ctx += `\n■ ${item.name} — ${item.place}\n`;
    if (item.content) ctx += `${item.content.slice(0, 300)}\n`;
  });
  return ctx;
}

async function searchLaw(query) {
  const key = cfg?.lawApiKey;

  try {

      .filter(w => !['있는','하는','위한','대한','관한','따른'].includes(w))
      .slice(0, 3).join(' ');
    if (!term) return '';

    const url = `https://www.law.go.kr/DRF/lawSearch.do?OC=${encodeURIComponent(key)}&target=law&type=JSON&query=${encodeURIComponent(term)}&display=5&page=1`;
    const resp = await fetch(url);
    if (!resp.ok) return '';
    const data = await resp.json();
    const items = data?.LawSearch?.law || [];
    if (!items.length) return '';

    let ctx = '\n\n[참고: 관련 법령 정보 (국가법령정보센터)]\n';

  } catch (_) { return ''; }
}

async function fetchMotifCompletion(payload, options = {}) {
  if (!cfg?.motifApiProxyUrl) throw new Error('Motif API proxy is not configured');
  const response = await fetch(cfg.motifApiProxyUrl, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': cfg.supabaseAnonKey,
      'Authorization': `Bearer ${cfg.supabaseAnonKey}`
    },
    body: JSON.stringify(payload),
    signal: options.signal
  });
  if (!response.ok) {
    throw new Error(`Motif API 오류 ${response.status}: ${await response.text()}`);
  }
  return response;
}

async function readMotifStream(response, onText) {
  if (!response.body) throw new Error('스트리밍 응답 본문이 없습니다.');
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let fullText = '';
  let usage = null;
  let finishReason = null;

  const handleLine = line => {
    const trimmed = line.trim();
    if (!trimmed.startsWith('data:')) return false;
    const data = trimmed.slice(5).trim();
    if (!data || data === '[DONE]') return data === '[DONE]';
    let event;
    try { event = JSON.parse(data); } catch (_) { return false; }
    if (event.usage) usage = event.usage;
    const choice = event.choices?.[0];
    if (choice?.finish_reason) finishReason = choice.finish_reason;
    const content = choice?.delta?.content;
    if (typeof content === 'string' && content) {
      fullText += content;
      onText(fullText);
    }
    return false;
  };

  try {
    while (true) {
      const { value, done } = await reader.read();
      buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
      const lines = buffer.split(/\r?\n/);
      buffer = lines.pop() || '';
      let finished = false;
      for (const line of lines) finished = handleLine(line) || finished;
      if (done || finished) break;
    }
    if (buffer) handleLine(buffer);
    return { text: fullText, usage, finishReason, stopped: false };
  } catch (error) {
    if (error?.name === 'AbortError') {
      return { text: fullText, usage, finishReason, stopped: true };
    }
    throw error;
  } finally {
    reader.releaseLock();
  }
}

async function runSpellCheck() {
  const text = document.getElementById('spellInput').value.trim();
  if (!text) return;

  const resultEl = document.getElementById('spellResult');
  const btn = document.getElementById('spellCheckBtn');
  resultEl.innerHTML = '<div style="color:var(--muted);font-size:13px;">맞춤법 검사 중...</div>';
  resultEl.style.display = 'block';
  btn.disabled = true;

  // AI에게 맞춤법 검사 요청 (채팅창에 전송하지 않고 직접 호출)
  const model = document.getElementById('modelSelect')?.value || 'motif3';
  const checkPrompt = `다음 텍스트의 한국어 맞춤법과 문법을 검사해 주세요.
오류가 있으면 표 형식(원문 | 수정 | 설명)으로 정리하고, 수정된 전체 텍스트도 제시해 주세요.
오류가 없으면 "맞춤법 오류가 없습니다."라고 답해 주세요.

[검사 대상]
${text}`;

  try {
    const resp = await fetchMotifCompletion({
        model,
        messages: [
          { role: 'system', content: '당신은 한국어 맞춤법 전문가입니다. 요청된 텍스트만 검사하고 결과를 간결하게 제시하세요.' },
          { role: 'user', content: checkPrompt }
        ],
        stream: false,
        max_tokens: 2048,
        temperature: 0.2
    });
    const data = await resp.json();
    const result = data?.choices?.[0]?.message?.content || '결과를 가져오지 못했습니다.';
    resultEl.innerHTML = `
      <div style="border-top:1px solid var(--line);padding-top:14px;margin-top:14px;">
        <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">검사 결과</div>
        <div style="font-size:13.5px;line-height:1.7;">${renderMd(result)}</div>
        <button onclick="applySpellResult()" style="margin-top:12px;height:34px;background:var(--accent);color:#fff;border:none;border-radius:7px;padding:0 14px;font-size:13px;cursor:pointer;">
          수정문 입력창에 붙여넣기
        </button>
      </div>`;
    resultEl._rawResult = result;
  } catch (e) {
    resultEl.innerHTML = `<div style="color:var(--danger);font-size:13px;">오류: ${escHtml(e.message)}</div>`;
  } finally {
    btn.disabled = false;
  }
}

function applySpellResult() {
  // 수정된 전체 텍스트를 입력창에 붙여넣기
  const resultEl = document.getElementById('spellResult');
  const raw = resultEl?._rawResult || '';
  // "수정된 전체 텍스트" 또는 마지막 코드블록 추출 시도
  const match = raw.match(/```[\s\S]*?```/) || raw.match(/수정[된]?\s*[전체]?\s*[텍스트]?[:\s]+([\s\S]+)/);
  const extracted = match ? match[0].replace(/```/g,'').trim() : raw;
  textarea.value = extracted;
  textarea.dispatchEvent(new Event('input'));
  closeSpellCheck();
  textarea.focus();
}

async function performWebSearch(query) {
  const key = cfg?.tavilyApiKey;
  if (!key || key === 'YOUR_TAVILY_API_KEY') return '';
  try {
    const resp = await fetch('https://api.tavily.com/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        api_key: key,
        query,
        search_depth: 'basic',
        max_results: 5,
        include_answer: true,
        include_raw_content: false
      })
    });
    if (!resp.ok) return '';
    const data = await resp.json();
    let ctx = '\n\n[실시간 웹 검색 결과 — 아래 정보를 참고하여 답변하세요]\n';
    if (data.answer) ctx += `요약: ${data.answer}\n\n`;
    (data.results || []).slice(0, 5).forEach((r, i) => {
      ctx += `[${i + 1}] ${r.title}\n`;
      if (r.content) ctx += `${r.content.slice(0, 300)}\n`;
      ctx += `출처: ${r.url}\n\n`;
    });
    return ctx;
  } catch (_) { return ''; }
}

// ─── 유틸 ────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderMd(text) {
  return text
    .replace(/```([\s\S]*?)```/g, (_, c) => `<div class="code-block"><pre>${escHtml(c.trim())}</pre></div>`)
    .replace(/`([^`]+)`/g, (_, c) => `<code>${escHtml(c)}</code>`)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm,  '<h3>$1</h3>')
    .replace(/^- (.+)$/gm,   '<li>$1</li>')
    .replace(/(<li>[\s\S]+?<\/li>)/g, '<ul>$1</ul>')
    .replace(/\n{2,}/g, '</p><p>')
    .replace(/^(?!<[hup\/]|<div)(.+)$/gm, '<p>$1</p>');
}

// ─── 사이드바 렌더링 ─────────────────────────────────────────
function renderSidebar() {
  const convs = getConvs().sort((a, b) => b.updatedAt - a.updatedAt);
  const now        = Date.now();
  const todayStart = new Date().setHours(0, 0, 0, 0);
  const weekStart  = todayStart - 6 * 86400000;

  const groups = [
    { label: '오늘',    items: convs.filter(c => c.updatedAt >= todayStart) },
    { label: '이번 주', items: convs.filter(c => c.updatedAt >= weekStart && c.updatedAt < todayStart) },
    { label: '이전',    items: convs.filter(c => c.updatedAt < weekStart) },
  ];

  convList.innerHTML = groups
    .filter(g => g.items.length)
    .map(g => `
      <div class="nav-section">${g.label}</div>
      ${g.items.map(c => `
        <div class="chat-item ${c.id === currentConvId ? 'active' : ''}"
             onclick="loadConversation('${c.id}')"
             title="${escHtml(c.title)}">
          <span class="dot"></span>
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;">${escHtml(c.title)}</span>
          <span onclick="deleteConversation(event,'${c.id}')"
                style="opacity:0;padding:0 4px;font-size:11px;color:#6b7e94;"
                class="del-btn">✕</span>
        </div>`).join('')}
    `).join('');
}

function loadConversation(id) {
  const conv = getConvs().find(c => c.id === id);
  if (!conv) return;

  currentConvId = id;
  chatHistory   = [...conv.messages];
  setCurrId(id);
  chatTitle.textContent = conv.title;

  convInner.innerHTML = '';
  conv.messages.forEach(m => {
    const bodyEl = appendMsgEl(m.role);
    bodyEl.innerHTML = m.role === 'user' ? `<p>${escHtml(m.content)}</p>` : renderMd(m.content);
    if (m.role === 'assistant') addMessageActions(bodyEl, m.content);
  });

  workspace.scrollTop = workspace.scrollHeight;
  renderSidebar();
  if (window.innerWidth <= 860) closeSidebar();
}

// ─── 메시지 DOM 추가 ─────────────────────────────────────────
function appendMsgEl(role) {
  const isAI  = role === 'assistant';
  const now   = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  const avatar = isAI ? 'H' : (user?.name?.[0]?.toUpperCase() || 'U');
  const name   = isAI ? 'Herion' : (user?.name || '사용자');

  const div = document.createElement('div');
  div.className = `msg ${isAI ? 'ai' : 'user'}`;
  div.innerHTML = `
    <div class="msg-header">
      <div class="msg-avatar">${escHtml(avatar)}</div>
      <span>${escHtml(name)}</span>
      <span style="color:var(--muted);font-size:12px;">${now}</span>
    </div>
    <div class="msg-body"></div>`;
  convInner.appendChild(div);
  workspace.scrollTop = workspace.scrollHeight;
  return div.querySelector('.msg-body');
}

function addMessageActions(bodyEl, content) {
  if (!bodyEl || !content || bodyEl.parentElement.querySelector('.msg-actions')) return;
  const actions = document.createElement('div');
  actions.className = 'msg-actions';

  const copyButton = document.createElement('button');
  copyButton.className = 'action-pill';
  copyButton.type = 'button';
  copyButton.textContent = '복사';
  copyButton.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(content);
      copyButton.textContent = '복사됨';
      setTimeout(() => { copyButton.textContent = '복사'; }, 1200);
    } catch (_) {
      const temp = document.createElement('textarea');
      temp.value = content;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand('copy');
      temp.remove();
      copyButton.textContent = '복사됨';
    }
  });

  const retryButton = document.createElement('button');
  retryButton.className = 'action-pill';
  retryButton.type = 'button';
  retryButton.textContent = '다시 생성';
  retryButton.addEventListener('click', () => regenerateLastResponse(bodyEl));

  actions.append(copyButton, retryButton);
  bodyEl.parentElement.appendChild(actions);
}

function persistCurrentConversation() {
  const convs = getConvs();
  const idx = convs.findIndex(c => c.id === currentConvId);
  if (idx >= 0) {
    convs[idx].messages = [...chatHistory];
    convs[idx].updatedAt = Date.now();
    setConvs(convs);
  }
}

async function regenerateLastResponse(bodyEl) {
  if (isStreaming || chatHistory.at(-1)?.role !== 'assistant') return;
  const lastUser = [...chatHistory].reverse().find(message => message.role === 'user');
  if (!lastUser) return;
  chatHistory.pop();
  bodyEl.closest('.msg')?.remove();
  persistCurrentConversation();
  await sendMessage({ reuseLastUser: true });
}

// 대화가 길어지면 오래된 부분을 요약해 압축 (백그라운드)
async function compressHistoryIfNeeded() {
  if (chatHistory.length <= 20) return;
  const keepCount  = 16;
  const toSummarize = chatHistory.filter(m => m.role !== 'system').slice(0, chatHistory.length - keepCount);
  if (!toSummarize.length) return;
  try {
    const resp = await fetchMotifCompletion({
        model: document.getElementById('modelSelect')?.value || 'motif3',
        messages: [
          { role: 'system', content: '아래 대화를 3문장 이내로 요약하세요. 핵심 주제, 결정 사항, 주요 정보만 포함.' },
          { role: 'user',   content: toSummarize.map(m => `${m.role === 'user' ? '사용자' : 'AI'}: ${m.content}`).join('\n\n') }
        ],
        stream: false,
        max_tokens: 1024,
        temperature: 0.2
    });
    const summary = (await resp.json()).choices?.[0]?.message?.content ?? '';
    if (!summary) return;
    const recentPart = chatHistory.slice(chatHistory.length - keepCount);
    chatHistory = [{ role: 'system', content: `[이전 대화 요약]\n${summary}` }, ...recentPart];
    const convs = getConvs();
    const idx = convs.findIndex(c => c.id === currentConvId);
    if (idx >= 0) { convs[idx].messages = [...chatHistory]; setConvs(convs); }
  } catch (_) {}
}

async function sendMessage(options = {}) {
  if (isStreaming) return;
  const reuseLastUser = options.reuseLastUser === true;
  const reusedMessage = reuseLastUser
    ? [...chatHistory].reverse().find(message => message.role === 'user')
    : null;
  const text = reuseLastUser ? (reusedMessage?.content || '') : textarea.value.trim();
  if (!text) return;

  if (!cfg?.motifApiProxyUrl) {
    alert('Motif API 프록시가 설정되지 않았습니다.');
    return;
  }

  // 새 대화 생성
  if (!currentConvId && !reuseLastUser) {
    const id   = Date.now().toString();
    const title = text.length > 28 ? text.slice(0, 28) + '…' : text;
    const convs = getConvs();
    convs.unshift({ id, title, messages: [], updatedAt: Date.now() });
    setConvs(convs);
    currentConvId = id;
    setCurrId(id);
    chatTitle.textContent = title;
    convInner.innerHTML = '';
    renderSidebar();
  }

  if (!reuseLastUser) {
    textarea.value = '';
    textarea.style.height = 'auto';
  }
  setGenerationState(true);
  activeRequestController = new AbortController();

  // 첨부 파일 텍스트 포함
  const fileText = reuseLastUser
    ? ''
    : attachedFiles.map(f => `\n\n[첨부파일: ${f.name}]\n${f.content}`).join('');
  const fullContent = reuseLastUser ? text : (fileText ? `${text}${fileText}` : text);

  if (!reuseLastUser) {
    chatHistory.push({ role: 'user', content: fullContent });
    const userBodyEl = appendMsgEl('user');
    userBodyEl.innerHTML = `<p>${escHtml(text)}</p>` +
      attachedFiles.map(f => `<div class="file-chip">📄 ${escHtml(f.name)}</div>`).join('');
    clearAttachments();
  }

  // ── "기억해줘" 명령 감지 ──────────────────────────────────
  const memMatch = text.match(/^기억해줘[:\s]+(.+)|(.+?)[을를]?\s*기억해(?:줘|주세요|줄래|줘요)?$/);
  if (!reuseLastUser && memMatch && !fileText) {
    const mem = ((memMatch[1] || memMatch[2]) ?? text).replace(/[.。!?]+$/, '').trim();
    saveUserMem(mem);
    const bodyEl = appendMsgEl('assistant');
    bodyEl.innerHTML = `<p>✓ 기억했습니다. <span style="color:var(--muted);font-style:italic;">${escHtml(mem)}</span></p>`;
    chatHistory.push({ role: 'assistant', content: `기억했습니다: ${mem}` });
    activeRequestController = null;
    setGenerationState(false);
    const convs2 = getConvs();
    const idx2 = convs2.findIndex(c => c.id === currentConvId);
    if (idx2 >= 0) { convs2[idx2].messages = [...chatHistory]; convs2[idx2].updatedAt = Date.now(); setConvs(convs2); }
    renderSidebar();
    return;
  }

  // 웹 검색 여부 결정: 수동 ON 또는 자동 감지
  const shouldSearch = webSearchEnabled || needsWebSearch(text);
  const hasSearchKey = cfg?.tavilyApiKey && cfg.tavilyApiKey !== 'YOUR_TAVILY_API_KEY';

  const thinkEl = appendThinking(shouldSearch && hasSearchKey ? '🌐 웹 검색 중...' : '생각 중...');
  const model   = document.getElementById('modelSelect')?.value || 'motif3';

  let assistantBodyEl = null;
  try {
    // 웹검색·법령검색 병렬 실행
    const heritageCtx = searchHeritageContext(text);
    const [searchCtx, lawCtx] = await Promise.all([
      (shouldSearch && hasSearchKey) ? performWebSearch(text) : Promise.resolve(''),
      needsLawSearch(text)           ? searchLaw(text)        : Promise.resolve(''),
    ]);
    if (searchCtx || lawCtx) setThinkingLabel(thinkEl, '생각 중...');

    const systemPrompt = getSystemPrompt(heritageCtx + lawCtx + searchCtx);

    // 대화 기록은 최근 20턴만 전송 (토큰 절감)
    const MAX_HIST = 20;
    const histSlice = chatHistory.length > MAX_HIST
      ? chatHistory.slice(chatHistory.length - MAX_HIST)
      : chatHistory;

    const resp = await fetchMotifCompletion({
        model,
        messages: [{ role: 'system', content: systemPrompt }, ...histSlice],
        stream: true,
        max_tokens: 4096,
        temperature: 0.6
    }, { signal: activeRequestController.signal });

    thinkEl.remove();
    assistantBodyEl = appendMsgEl('assistant');
    assistantBodyEl.innerHTML = '<div class="thinking">답변을 구성하고 있습니다…</div>';
    const result = await readMotifStream(resp, fullText => {
      assistantBodyEl.innerHTML = `${renderMd(fullText)}<span class="streaming-cursor" aria-hidden="true"></span>`;
      workspace.scrollTop = workspace.scrollHeight;
    });
    const full = result.text.trim();
    if (!full) {
      if (result.stopped) {
        assistantBodyEl.innerHTML = '<p style="color:var(--muted);">답변 생성을 중지했습니다.</p>';
        return;
      }
      throw new Error(result.finishReason === 'length'
        ? '생성 한도 안에 최종 답변이 만들어지지 않았습니다. 다시 생성해 주세요.'
        : '모델이 표시할 최종 답변을 반환하지 않았습니다.');
    }
    assistantBodyEl.innerHTML = renderMd(full);
    if (result.stopped) {
      assistantBodyEl.insertAdjacentHTML('beforeend', '<div style="margin-top:8px;color:var(--muted);font-size:12px;">사용자가 생성을 중지했습니다.</div>');
    }
    addMessageActions(assistantBodyEl, full);
    workspace.scrollTop = workspace.scrollHeight;

    // 웹 검색을 사용한 경우 출처 배지 표시
    if (searchCtx) {
      const sources = [...searchCtx.matchAll(/출처: (https?:\/\/[^\s\n]+)/g)]
        .map(m => m[1]).slice(0, 3);
      if (sources.length) {
        const sourceDiv = document.createElement('div');
        sourceDiv.style.cssText = 'margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;';
        sourceDiv.innerHTML = sources.map(u => {
          const domain = new URL(u).hostname.replace('www.', '');
          return `<a href="${u}" target="_blank" rel="noopener"
            style="font-size:11px;border:1px solid var(--line);border-radius:999px;
                   padding:3px 9px;color:var(--muted);text-decoration:none;background:#fff;">
            🌐 ${domain}</a>`;
        }).join('');
        assistantBodyEl.appendChild(sourceDiv);
      }
    }

    chatHistory.push({ role: 'assistant', content: full });

    // 대화 로그 Supabase에 기록 (비동기, 오류 무시)
    if (sb) {
      sb.from('chat_logs').insert({
        user_email: user.email,
        user_name:  user.name,
        model,
        question:   text.slice(0, 300)
      }).then().catch(() => {});
    }

    // localStorage에 저장
    persistCurrentConversation();
    renderSidebar();
    compressHistoryIfNeeded(); // 백그라운드 압축 (await 없음)

  } catch (err) {
    thinkEl.remove();
    const bodyEl = assistantBodyEl || appendMsgEl('assistant');
    if (err?.name === 'AbortError') {
      bodyEl.innerHTML = '<p style="color:var(--muted);">답변 생성을 중지했습니다.</p>';
    } else {
      bodyEl.innerHTML = `<p style="color:var(--danger);">오류: ${escHtml(err.message)}</p>`;
    }
  } finally {
    activeRequestController = null;
    setGenerationState(false);
    textarea.focus();
  }
}

// ─── 파일 첨부 ───────────────────────────────────────────────
let attachedFiles = [];  // [{name, content}]

const fileBtn     = document.getElementById('fileBtn');
const fileInput   = document.getElementById('fileInput');
const filePreview = document.getElementById('filePreview');
const inputShell  = document.querySelector('.input-shell');
const dropZone    = document.querySelector('main');
let dragDepth     = 0;

fileBtn.addEventListener('click', () => fileInput.click());

async function handleFiles(files) {
  const incoming = Array.from(files || []);
  if (!incoming.length) return;
  const errors = [];
  inputShell.classList.remove('drag-active');

  for (const file of incoming) {
    if (file.size > 20 * 1024 * 1024) {
      errors.push(`${file.name}: 파일 크기는 20MB 이하여야 합니다.`);
      continue;
    }
    if (attachedFiles.some(item => item.name === file.name && item.size === file.size)) continue;
    try {
      const content = await extractText(file);
      attachedFiles.push({ name: file.name, content, size: file.size });
    } catch (e) {
      errors.push(`${file.name}: ${e.message}`);
    }
  }
  renderFileChips();
  if (errors.length) alert(errors.join('\n'));
}

fileInput.addEventListener('change', async () => {
  await handleFiles(fileInput.files);
  fileInput.value = '';
});

function hasDraggedFiles(event) {
  return Array.from(event.dataTransfer?.types || []).includes('Files');
}

dropZone.addEventListener('dragenter', event => {
  if (!hasDraggedFiles(event)) return;
  event.preventDefault();
  dragDepth += 1;
  inputShell.classList.add('drag-active');
});

dropZone.addEventListener('dragover', event => {
  if (!hasDraggedFiles(event)) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = 'copy';
});

dropZone.addEventListener('dragleave', event => {
  if (!hasDraggedFiles(event)) return;
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) inputShell.classList.remove('drag-active');
});

dropZone.addEventListener('drop', async event => {
  if (!hasDraggedFiles(event)) return;
  event.preventDefault();
  dragDepth = 0;
  inputShell.classList.remove('drag-active');
  await handleFiles(event.dataTransfer.files);
});

textarea.addEventListener('paste', async event => {
  const files = event.clipboardData?.files;
  if (!files?.length) return;
  event.preventDefault();
  await handleFiles(files);
});

function renderFileChips() {
  if (!attachedFiles.length) { filePreview.style.display = 'none'; return; }
  filePreview.style.display = 'flex';
  filePreview.innerHTML = attachedFiles.map((f, i) => `
    <div class="file-chip">
      📄 ${escHtml(f.name)}
      <button onclick="removeFile(${i})" title="제거">✕</button>
    </div>`).join('');
}

function removeFile(i) {
  attachedFiles.splice(i, 1);
  renderFileChips();
}

function clearAttachments() {
  attachedFiles = [];
  renderFileChips();
}

async function extractText(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  const MAX = 12000;

  if (['txt', 'md', 'csv'].includes(ext)) {
    const t = await file.text();
    return t.slice(0, MAX);
  }

  if (ext === 'pdf') {
    if (typeof pdfjsLib === 'undefined') throw new Error('PDF 라이브러리 로딩 중입니다. 잠시 후 다시 시도해주세요.');
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let text = '';
    for (let i = 1; i <= pdf.numPages && text.length < MAX; i++) {
      const page    = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(s => s.str).join(' ') + '\n';
    }
    return text.slice(0, MAX);
  }

  if (['docx', 'doc'].includes(ext)) {
    if (typeof mammoth === 'undefined') throw new Error('DOCX 라이브러리 로딩 중입니다.');
    const buf    = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer: buf });
    return result.value.slice(0, MAX);
  }

  if (['pptx', 'ppt'].includes(ext)) {
    if (typeof JSZip === 'undefined') throw new Error('ZIP 라이브러리 로딩 중입니다.');
    const buf  = await file.arrayBuffer();
    const zip  = await JSZip.loadAsync(buf);
    let text = '';
    const slides = Object.keys(zip.files)
      .filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n))
      .sort();
    for (const name of slides) {
      const xml = await zip.files[name].async('string');
      text += xml.replace(/<a:t>([^<]*)<\/a:t>/g, '$1 ').replace(/<[^>]+>/g, '') + '\n';
      if (text.length > MAX) break;
    }
    return text.slice(0, MAX) || '(텍스트를 추출하지 못했습니다)';
  }

  if (ext === 'hwpx') {
    if (typeof JSZip === 'undefined') throw new Error('ZIP 라이브러리 로딩 중입니다.');
    const buf = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(buf);
    let text = '';
    const sections = Object.keys(zip.files)
      .filter(n => /Contents\/section\d+\.xml/i.test(n))
      .sort();
    for (const name of sections) {
      const xml = await zip.files[name].async('string');
      text += xml.replace(/<hh:t[^>]*>([^<]*)<\/hh:t>/g, '$1 ').replace(/<[^>]+>/g, '') + '\n';
      if (text.length > MAX) break;
    }
    return text.slice(0, MAX) || '(텍스트를 추출하지 못했습니다)';
  }

  throw new Error(`지원하지 않는 형식입니다 (.${ext}). PDF·DOCX·PPTX·HWPX·TXT를 사용해주세요.`);
}

// ─── 초기화 ──────────────────────────────────────────────────
(function init() {
  const lastId = getCurrId();
  const convs  = getConvs();
  if (lastId && convs.find(c => c.id === lastId)) {
    loadConversation(lastId);
  } else {
    showWelcome();
  }
})();
</script>
