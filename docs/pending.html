<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Herion — 승인 대기</title>
  <style>
    :root {
      font-family: Inter, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      --accent: #19715f;
      --line: #d9dee7;
      --text: #1c2430;
      --muted: #657386;
      --bg: #f0f2f5;
      --panel: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 20px 48px rgba(21,32,46,.10);
      padding: 52px 44px 44px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: #fef8ec;
      border: 2px solid #f5dfa0;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      font-size: 28px;
    }

    h1 { font-size: 20px; font-weight: 760; margin-bottom: 10px; color: var(--text); }

    .desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .email-badge {
      display: inline-block;
      background: #e6f4f1;
      color: var(--accent);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 650;
      margin-bottom: 28px;
    }

    .steps {
      text-align: left;
      background: #f8fafb;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 28px;
    }

    .step {
      display: flex;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
      padding: 6px 0;
    }

    .step:not(:last-child) { border-bottom: 1px solid #edf0f4; }

    .step-num {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
      flex: 0 0 auto;
      margin-top: 1px;
    }

    .step-num.done { background: #c7e1d9; color: var(--accent); }

    .btn-outline {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      color: var(--text);
      margin-bottom: 10px;
    }

    .btn-outline:hover { background: #f4f6f8; }

    .footer {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⏳</div>
    <h1>승인 대기 중입니다</h1>

    <div class="desc">
      이메일 인증이 완료되었습니다.<br>
      관리자의 계정 승인 후 서비스를 이용하실 수 있습니다.
    </div>

    <div class="email-badge" id="userEmail">이메일 확인 중...</div>

    <div class="steps">
      <div class="step">
        <div class="step-num done">✓</div>
        <div>기관 이메일(@kh.or.kr) 인증 완료</div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div>관리자 승인 대기 중 — 보통 1영업일 이내 처리됩니다.</div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div>승인 완료 후 이메일로 안내 드립니다.</div>
      </div>
    </div>

    <button class="btn-outline" onclick="checkApproval()">승인 여부 다시 확인</button>
    <button class="btn-outline" onclick="logout()">다른 계정으로 로그인</button>

    <div class="footer">
      문의: 디지털혁신팀
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script>
    const cfg = window.HERION_CONFIG;
    const sb  = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { location.href = 'login.html'; return; }
      document.getElementById('userEmail').textContent = session.user.email;
    })();

    async function checkApproval() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { location.href = 'login.html'; return; }

      const { data } = await sb
        .from('profiles')
        .select('approved')
        .eq('id', session.user.id)
        .single();

      if (data?.approved) {
        location.href = 'index.html';
      } else {
        alert('아직 승인되지 않았습니다. 승인 후 이메일 안내를 드립니다.');
      }
    }

    async function logout() {
      await sb.auth.signOut();
      location.href = 'login.html';
    }
  </script>
</body>
</html>
