<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Herion — 관리자</title>
  <style>
    :root {
      font-family: Inter, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      --bg: #f0f2f5;
      --panel: #ffffff;
      --panel-2: #eef2f6;
      --line: #d9dee7;
      --text: #1c2430;
      --muted: #657386;
      --accent: #19715f;
      --accent-2: #2457a6;
      --warn: #a65f12;
      --danger: #b02020;
      --sidebar: #18202b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body { background: var(--bg); color: var(--text); min-height: 100vh; }

    .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }

    /* Sidebar */
    aside {
      background: var(--sidebar);
      color: #eef3f8;
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
      gap: 4px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 4px 6px 16px;
      border-bottom: 1px solid rgba(255,255,255,.1);
      margin-bottom: 8px;
      font-weight: 760;
      font-size: 17px;
    }

    .mark {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2bb58f, #2864bb);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 14px;
    }

    .nav-section {
      font-size: 10px;
      text-transform: uppercase;
      color: #6b7e94;
      padding: 12px 8px 4px;
      letter-spacing: .06em;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 10px;
      border-radius: 7px;
      font-size: 13.5px;
      color: #c4cdd8;
      cursor: pointer;
      text-decoration: none;
    }

    .nav-item:hover, .nav-item.active {
      background: rgba(255,255,255,.1);
      color: #fff;
    }

    .nav-item .icon { font-size: 15px; width: 18px; text-align: center; }

    .badge {
      margin-left: auto;
      background: #c0392b;
      color: #fff;
      border-radius: 999px;
      padding: 1px 7px;
      font-size: 11px;
    }

    .sidebar-footer {
      margin-top: auto;
      border-top: 1px solid rgba(255,255,255,.1);
      padding-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      color: #9facbb;
    }

    .avatar-sm {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: #2bb58f;
      display: grid;
      place-items: center;
      color: #09241d;
      font-weight: 800;
      font-size: 12px;
      flex: 0 0 auto;
    }

    /* Main */
    main { padding: 28px 32px; min-width: 0; }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 26px;
    }

    .page-header h1 { font-size: 22px; font-weight: 760; }
    .page-header p  { font-size: 13px; color: var(--muted); margin-top: 3px; }

    .date-range {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .btn-outline {
      height: 34px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 7px;
      padding: 0 13px;
      font-size: 13px;
      cursor: pointer;
      color: var(--text);
    }

    /* Stat cards */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 18px 20px;
    }

    .stat-card .label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .stat-card .value {
      font-size: 30px;
      font-weight: 780;
      margin: 6px 0 4px;
      line-height: 1;
    }

    .stat-card .delta {
      font-size: 12px;
      color: var(--muted);
    }

    .delta.up   { color: var(--accent); }
    .delta.warn { color: var(--warn); }
    .delta.down { color: var(--danger); }

    /* Two-col layout */
    .cols { display: grid; grid-template-columns: 1fr 360px; gap: 20px; margin-bottom: 24px; }

    /* Chart */
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 20px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .panel-header h2 { font-size: 15px; font-weight: 700; }

    .select {
      height: 30px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 7px;
      padding: 0 10px;
      font-size: 12px;
      color: var(--text);
    }

    .bar-chart {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 140px;
    }

    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      height: 100%;
      justify-content: flex-end;
    }

    .bar {
      width: 100%;
      background: #daeef8;
      border-radius: 4px 4px 0 0;
      position: relative;
    }

    .bar.accent { background: var(--accent); }
    .bar.today  { background: var(--accent-2); }

    .bar-label { font-size: 10px; color: var(--muted); }

    .legend {
      display: flex;
      gap: 14px;
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
    }

    .legend span::before {
      content: '';
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 2px;
      margin-right: 4px;
      vertical-align: middle;
    }

    .legend .l-req::before  { background: var(--accent); }
    .legend .l-token::before { background: #daeef8; }

    /* Category usage */
    .cat-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-top: 1px solid #edf0f4;
      font-size: 13px;
    }

    .cat-row:first-of-type { border-top: 0; }
    .cat-name { flex: 1; }

    .bar-inline {
      width: 90px;
      height: 6px;
      background: var(--panel-2);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill { height: 100%; background: var(--accent); border-radius: 999px; }
    .bar-fill.accent-2 { background: var(--accent-2); }

    .cat-pct { font-size: 12px; color: var(--muted); width: 32px; text-align: right; }

    /* Table */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      text-align: left;
      padding: 0 12px 10px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
    }

    tbody td {
      padding: 12px 12px;
      border-bottom: 1px solid #edf0f4;
      vertical-align: middle;
    }

    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: #f8fafb; }

    .user-cell { display: flex; align-items: center; gap: 9px; }

    .avatar-md {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--accent);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      flex: 0 0 auto;
    }

    .user-name  { font-weight: 600; }
    .user-email { font-size: 11px; color: var(--muted); }

    .role-badge {
      display: inline-block;
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 650;
    }

    .role-admin   { background: #e8f0fe; color: var(--accent-2); }
    .role-user    { background: #e6f4f1; color: var(--accent); }
    .role-pending { background: #fff3e0; color: var(--warn); }

    .progress-cell { min-width: 120px; }

    .progress-bar {
      height: 5px;
      background: var(--panel-2);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-fill { height: 100%; background: var(--accent); border-radius: 999px; }
    .progress-fill.warn { background: var(--warn); }

    .action-btn {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      color: var(--text);
    }

    .action-btn.approve { border-color: #a8d5c8; color: var(--accent); }
    .action-btn.deny    { border-color: #f5bfbf; color: var(--danger); }

    /* Activity log */
    .activity-list { display: grid; gap: 0; }

    .activity-item {
      display: grid;
      grid-template-columns: 32px 1fr auto;
      gap: 10px;
      align-items: start;
      padding: 11px 0;
      border-bottom: 1px solid #edf0f4;
    }

    .activity-item:last-child { border-bottom: 0; }

    .activity-icon {
      width: 30px; height: 30px;
      border-radius: 8px;
      background: var(--panel-2);
      display: grid;
      place-items: center;
      font-size: 14px;
    }

    .activity-body { font-size: 13px; }
    .activity-body .who { font-weight: 600; }
    .activity-body .what { color: var(--muted); font-size: 12px; margin-top: 1px; }
    .activity-time { font-size: 11px; color: var(--muted); white-space: nowrap; }

    @media (max-width: 1100px) {
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .cols { grid-template-columns: 1fr; }
    }

    @media (max-width: 720px) {
      .app { grid-template-columns: 1fr; }
      aside { display: none; }
      main { padding: 20px 16px; }
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <aside>
    <div class="brand">
      <div class="mark">H</div>
      <span>Herion</span>
    </div>

    <div class="nav-section">서비스</div>
    <a href="index.html" class="nav-item"><span class="icon">💬</span> 채팅으로 이동</a>

    <div class="nav-section">관리자</div>
    <a href="admin.html" class="nav-item active"><span class="icon">📊</span> 대시보드</a>
    <a href="#users"     class="nav-item"><span class="icon">👥</span> 사용자 관리 <span class="badge">3</span></a>
    <a href="#activity"  class="nav-item"><span class="icon">📋</span> 사용 로그</a>
    <a href="#"          class="nav-item"><span class="icon">⚙️</span> 서비스 설정</a>

    <div class="sidebar-footer" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <div class="avatar-sm" id="adminInitial">?</div>
      <div style="flex:1;min-width:0;">
        <div id="adminName" style="font-size:12.5px;font-weight:600;color:#c4cdd8;">로딩 중...</div>
        <div id="adminEmail" style="font-size:11px;color:#8a96a3;"></div>
      </div>
      <button onclick="logout()"
         style="font-size:11px;color:#8a96a3;background:none;border:none;cursor:pointer;padding:3px 0;">로그아웃</button>
    </div>
  </aside>

  <!-- Main -->
  <main>
    <div class="page-header">
      <div>
        <h1>관리자 대시보드</h1>
        <p>국가유산진흥원 AI 업무 보조 서비스 운영 현황</p>
      </div>
      <div class="date-range">
        <button class="btn-outline">이번 달 ▾</button>
        <button class="btn-outline">내보내기</button>
      </div>
    </div>

    <!-- Stat cards -->
    <div class="stat-grid" id="statGrid">
      <div class="stat-card"><div class="label">전체 직원</div><div class="value" id="statTotal">—</div></div>
      <div class="stat-card"><div class="label">관리자</div><div class="value" id="statAdmin">—</div></div>
      <div class="stat-card"><div class="label">일반 직원</div><div class="value" id="statUser">—</div></div>
      <div class="stat-card"><div class="label">최근 등록</div><div class="value" id="statRecent" style="font-size:16px;margin-top:8px;">—</div></div>
    </div>

    <!-- 직원 등록 폼 -->
    <div class="panel" style="margin-bottom:24px;">
      <div class="panel-header"><h2>직원 등록</h2></div>
      <div style="display:grid;grid-template-columns:1fr 1fr auto auto;gap:10px;align-items:end;">
        <div>
          <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:5px;">이름</label>
          <input id="newName" type="text" placeholder="홍길동"
            style="width:100%;height:38px;border:1px solid var(--line);border-radius:7px;padding:0 12px;font-size:13.5px;outline:none;">
        </div>
        <div>
          <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:5px;">이메일</label>
          <input id="newEmail" type="email" placeholder="hong@kh.or.kr"
            style="width:100%;height:38px;border:1px solid var(--line);border-radius:7px;padding:0 12px;font-size:13.5px;outline:none;">
        </div>
        <div>
          <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:5px;">권한</label>
          <select id="newRole"
            style="height:38px;border:1px solid var(--line);border-radius:7px;padding:0 10px;font-size:13.5px;">
            <option value="user">일반</option>
            <option value="admin">관리자</option>
          </select>
        </div>
        <button onclick="addEmployee()"
          style="height:38px;background:var(--accent);color:#fff;border:none;border-radius:7px;padding:0 18px;font-size:13.5px;font-weight:650;cursor:pointer;">
          추가
        </button>
      </div>
      <div id="addMsg" style="margin-top:8px;font-size:12.5px;display:none;"></div>
    </div>

    <!-- 직원 목록 -->
    <div class="panel" id="users">
      <div class="panel-header">
        <h2>직원 목록</h2>
        <button class="btn-outline" style="font-size:12px;" onclick="loadEmployees()">새로고침</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>직원</th>
            <th>권한</th>
            <th>등록일</th>
            <th>삭제</th>
          </tr>
        </thead>
        <tbody id="employeeTable">
          <tr><td colspan="4" style="text-align:center;color:var(--muted);padding:24px;">로딩 중...</td></tr>
        </tbody>
      </table>
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
  const user = JSON.parse(sessionStorage.getItem('herion_user') || 'null');

  if (!user) {
    location.href = 'login.html';
  } else if (user.role !== 'admin') {
    location.href = 'index.html';
  } else {
    document.getElementById('adminEmail').textContent   = user.email;
    document.getElementById('adminName').textContent    = user.name;
    document.getElementById('adminInitial').textContent = user.name[0].toUpperCase();
  }

  function logout() {
    sessionStorage.removeItem('herion_user');
    location.href = 'login.html';
  }

  const cfg = window.HERION_CONFIG;
  const sb  = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

  async function loadEmployees() {
    const tbody = document.getElementById('employeeTable');
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:24px;">로딩 중...</td></tr>';

    const { data, error } = await sb.from('employees').select('*').order('created_at', { ascending: false });

    if (error || !data) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;color:var(--danger);padding:24px;">오류: ${error?.message}</td></tr>`;
      return;
    }

    const total  = data.length;
    const admins = data.filter(e => e.role === 'admin').length;
    const users  = data.filter(e => e.role === 'user').length;
    const recent = total > 0 ? data[0].name : '—';

    document.getElementById('statTotal').textContent  = total;
    document.getElementById('statAdmin').textContent  = admins;
    document.getElementById('statUser').textContent   = users;
    document.getElementById('statRecent').textContent = recent;

    if (total === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:24px;">등록된 직원이 없습니다.</td></tr>';
      return;
    }

    tbody.innerHTML = data.map(emp => {
      const initial = emp.name ? emp.name[0] : '?';
      const date    = new Date(emp.created_at).toLocaleDateString('ko-KR');
      const badge   = emp.role === 'admin'
        ? '<span class="role-badge role-admin">관리자</span>'
        : '<span class="role-badge role-user">일반</span>';
      return `<tr>
        <td>
          <div class="user-cell">
            <div class="avatar-md">${initial}</div>
            <div>
              <div class="user-name">${emp.name}</div>
              <div class="user-email">${emp.email}</div>
            </div>
          </div>
        </td>
        <td>${badge}</td>
        <td style="color:var(--muted);font-size:12px;">${date}</td>
        <td>
          <button class="action-btn deny" onclick="deleteEmployee('${emp.id}', '${emp.name}')">삭제</button>
        </td>
      </tr>`;
    }).join('');
  }

  async function addEmployee() {
    const nameEl  = document.getElementById('newName');
    const emailEl = document.getElementById('newEmail');
    const roleEl  = document.getElementById('newRole');
    const msgEl   = document.getElementById('addMsg');

    const name  = nameEl.value.trim();
    const email = emailEl.value.trim().toLowerCase();
    const role  = roleEl.value;

    msgEl.style.display = 'none';

    if (!name || !email) {
      msgEl.textContent = '이름과 이메일을 모두 입력해 주세요.';
      msgEl.style.color = 'var(--danger)';
      msgEl.style.display = 'block';
      return;
    }

    const { error } = await sb.from('employees').insert({ name, email, role });

    if (error) {
      msgEl.textContent = error.code === '23505' ? '이미 등록된 이메일입니다.' : `오류: ${error.message}`;
      msgEl.style.color = 'var(--danger)';
      msgEl.style.display = 'block';
      return;
    }

    nameEl.value  = '';
    emailEl.value = '';
    roleEl.value  = 'user';
    msgEl.textContent = `${name} 님이 등록되었습니다.`;
    msgEl.style.color = 'var(--accent)';
    msgEl.style.display = 'block';
    setTimeout(() => { msgEl.style.display = 'none'; }, 3000);

    loadEmployees();
  }

  async function deleteEmployee(id, name) {
    if (!confirm(`${name} 님을 삭제하시겠습니까?`)) return;

    const { error } = await sb.from('employees').delete().eq('id', id);

    if (error) {
      alert(`삭제 오류: ${error.message}`);
      return;
    }

    loadEmployees();
  }

  loadEmployees();
</script>
</body>
</html>
