services:
  herion:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_TAG:-main}
    container_name: herion-open-webui
    restart: unless-stopped
    ports:
      - "${HERION_PORT:-3000}:8080"
    environment:
      WEBUI_NAME: "${WEBUI_NAME:-Herian}"
      WEBUI_URL: "${WEBUI_URL:-http://localhost:3000}"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:-change-this-for-poc-only}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DEFAULT_SYSTEM_PROMPT: "${DEFAULT_SYSTEM_PROMPT:-당신은 국가유산진흥원 직원 전용 AI 업무 보조 시스템 Herian(헤리안)입니다. Heritage와 an을 결합한 이름으로 유산 전문가를 의미합니다.\n\n규칙:\n- 항상 한국어로 답변하세요.\n- 내부 추론 과정은 절대 출력하지 마세요. 최종 답변만 출력하세요.\n- 짧은 질문이나 인사에는 간결하게 답변하세요.\n- 업무 관련 질문에는 명확하고 실용적으로 답변하세요.\n- 공공기관에 적합한 격식체(합쇼체)를 사용하세요.}"
      DEFAULT_USER_ROLE: "${DEFAULT_USER_ROLE:-pending}"
      ENABLE_SIGNUP: "${ENABLE_SIGNUP:-true}"
      ENABLE_LOGIN_FORM: "${ENABLE_LOGIN_FORM:-true}"
      ENABLE_OAUTH_SIGNUP: "${ENABLE_OAUTH_SIGNUP:-false}"
      ENABLE_OAUTH_PERSISTENT_CONFIG: "${ENABLE_OAUTH_PERSISTENT_CONFIG:-false}"
      OAUTH_ALLOWED_DOMAINS: "${OAUTH_ALLOWED_DOMAINS:-kh.or.kr}"
      MICROSOFT_CLIENT_ID: "${MICROSOFT_CLIENT_ID:-}"
      MICROSOFT_CLIENT_SECRET: "${MICROSOFT_CLIENT_SECRET:-}"
      MICROSOFT_CLIENT_TENANT_ID: "${MICROSOFT_CLIENT_TENANT_ID:-}"
      MICROSOFT_REDIRECT_URI: "${MICROSOFT_REDIRECT_URI:-http://localhost:3000/oauth/microsoft/callback}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-http://localhost:3000/oauth/google/callback}"
    volumes:
      - herion-open-webui-data:/app/backend/data

  document-service:
    profiles: ["documents"]
    build:
      context: ./services/document-service
    container_name: herion-document-service
    restart: unless-stopped
    ports:
      - "${HERION_DOCUMENT_PORT:-8010}:8010"
    environment:
      HERION_ALLOWED_ORIGINS: "${HERION_ALLOWED_ORIGINS:-https://icanjt7.github.io,http://localhost:3000}"
      HERION_TEMPLATE_DIR: /app/templates

volumes:
  herion-open-webui-data:
